document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

security-breach\",summary:\"Prompt-injection attempt surfaced part of the system prompt to an agent\",lifecycleStage:\"Deploy\",\n   reportable:false,rootCause:\"Customer text passed to the model without the injection filter on one channel\",raisedAt:\"2026-07-08\",status:\"open\",by:\"jonah\",risk:\"r9\"},\n  {id:\"n6\",init:\"rcr\",model:\"md-credit\",classification:\"performance-drift\",summary:\"Approval rate drifted four points after the June rate change\",lifecycleStage:\"Operate & Monitor\",\n   reportable:false,rootCause:\"Affordability features shifted faster than the quarterly retrain\",raisedAt:\"2026-07-05\",status:\"open\",by:\"marcus\",risk:\"r3\"},\n  {id:\"n7\",init:\"fraud\",model:\"md-fraud\",classification:\"malfunction\",summary:\"Scorer latency breached the 150 ms SLA at peak\",lifecycleStage:\"Operate & Monitor\",\n   reportable:false,rootCause:\"Feature-store read contention during the month-end batch\",raisedAt:\"2026-06-18\",status:\"closed\",by:\"jonah\",risk:null},\n  {id:\"n8\",init:\"chatbot\",model:\"md-embed\",classification:\"security-breach\",summary:\"Shared embedding index returned document titles across business units\",lifecycleStage:\"Operate & Monitor\",\n   reportable:false,rootCause:\"No per-tenant isolation on the shared vector index\",raisedAt:\"2026-07-11\",status:\"open\",by:\"leah\",risk:null}\n];\n\n/* Every decision names the SESSION it was taken at. A decision with no session is an\n   assertion; a decision with one is minuted, quorate and attributable. */\nvar DECISIONS = [\n  {id:\"d1\",kind:\"aiia-trigger\",subject:\"aiia\",init:\"hiring\",by:\"alicia\",at:\"2026-06-12\",meeting:\"bm-q2\",summary:\"Board holds CV screening at the gate until a FRIA and an independent bias audit are complete.\"},\n  {id:\"d2\",kind:\"risk-treatment\",subject:\"r2\",init:\"rcr\",by:\"priya\",at:\"2026-06-12\",meeting:\"bm-q2\",summary:\"Mitigate: re-weight the flagged cohort and re-test before the scale decision; review every 30 days. ycle\",cls:\"quorum-counting\",who:null}\n];\nfunction boardQuorum(){ return Math.ceil(BOARD_SEATS.length/2); }\n\n/* A Board meeting is an INSTANCE of the board meeting up — a date, who sat, what was reviewed,\n   and what was decided there. It is the session a decision is anchored to. */\nvar MEETINGS = [\n  {id:\"bm-q1\",title:\"Q1 management review\",date:\"2026-04-03\",status:\"held\",chair:\"alicia\",\n   present:[\"board-chair\",\"aims-manager\",\"ai-risk-owner\",\"impact-assessment-owner\",\"internal-audit-owner\",\"data-privacy-owner\"],\n   reviewed:[\"rcr\",\"fraud\"],minute:\"Policy set adopted. Portfolio reviewed; no gate items raised.\",clause:\"Cl.9.3 management review\"},\n  {id:\"bm-may\",title:\"May risk session\",date:\"2026-05-14\",status:\"held\",chair:\"priya\",\n   present:[\"board-chair\",\"aims-manager\",\"ai-risk-owner\",\"data-privacy-owner\",\"competence-owner\"],\n   reviewed:[\"fraud\"],minute:\"Fraud triage residual exposure accepted at the tuned threshold.\",clause:\"Cl.6.1.2 AI risk assessment\"},\n  {id:\"bm-q2\",title:\"Q2 governance board\",date:\"2026-06-12\",status:\"held\",chair:\"alicia\",\n   present:[\"board-chair\",\"aims-manager\",\"ai-risk-owner\",\"impact-assessment-owner\",\"internal-audit-owner\",\"data-privacy-owner\",\"competence-owner\"],\n   reviewed:[\"hiring\",\"rcr\",\"chatbot\"],minute:\"CV screening held at the gate. Credit scoring mitigation agreed. Chatbot assessment signed off for pilot scope.\",clause:\"Cl.9.3 management review\"},\n  {id:\"bm-jul\",title:\"Q3 governance board\",date:\"2026-07-10\",status:\"scheduled\",chair:\"alicia\",\n   present:[\"board-chair\",\"aims-manager\",\"ai-risk-owner\",\"impact-assessment-owner\",\"data-privacy-owner\"],\n   reviewed:[\"rcr\",\"hiring\"],minute:\"\",clause:\"Cl.9.3 management review\"}\n];\n\n/* The AI Canvas (AIP-5) — the seven fields, with the reference's verbatim prompts. This is the\n   high-level DEFINITION of an initiative: an initiative with an incomplete canvas has not been\n   defined, only named, and `validateCanvas` is what says so. */\nvar CANVAS_BLOCKS = [\n  {f:\"businessProblem\",l:\"Business Problem\",span:\"wide\",\n   p:\"What is the business problem to be solved with the application of AI and why is it an important problem?\"},\n  {f:\"businessValue\",l:\"Business Value\",span:\"wide\",\n   p:\"What is the anticipated business value that can be created by the initiative?\"},\n  {f:\"objectiveFunction\",l:\"Objective Function\",span:\"quarter\",\n   p:\"What is the dependent variable to be optimized and what are the features used to predict it?\"},\n  {f:\"modelingApproach\",l:\"Modeling Approach\",span:\"quarter\",\n   p:\"What type of ML approach best fits the problem and what algorithm / tools should be applied?\"},\n  {f:\"modelTraining\",l:\"Model Training\",span:\"quarter\",\n   p:\"How will the model improve from feedback, and how will decisions be disseminated?\"},\n  {f:\"customerValue\",l:\"Customer Value\",span:\"quarter\",\n   p:\"How will this impact the customer experience and drive higher customer value?\"},\n  {f:\"dataStrategy\",l:\"Data Strategy\",span:\"full\",\n   p:\"What data will be collected, from where? How will it be ingested, stored and prepared?\"}\n];\nvar CANVASES = {\n  rcr:{init:\"rcr\",businessProblem:\"Manual retail credit review is slow and inconsistent, driving delay and applicant drop-off at the point of decision.\",\n    businessValue:\"Cuts decision latency from days to minutes and standardises the basis of a decline, which is also what makes it contestable.\",\n    objectiveFunction:\"Probability of 90-day default, predicted from bureau history, affordability and account-behaviour features.\",\n    modelingApproach:\"Gradient-boosted trees with a monotonic constraint on affordability, plus a calibration layer.\",\n    modelTraining:\"Quarterly retrain on a rolling 36-month window; challenger runs shadow before promotion.\",\n    customerValue:\"A same-session answer with reason codes the servicing channel can actually read back.\",\n    dataStrategy:\"Bureau feed and internal account history into the customer feature store; no special-category data.\"},\n  chatbot:{init:\"chatbot\",businessProblem:\"Front-line agents spend most of a call searching policy documents instead of resolving the customer's problem.\",\n    businessValue:\"Shorter handling times and fewer escalations, without moving the decision away from the agent.\",\n    objectiveFunction:\"Retrieval relevance and citation-support rate on the answer shown to the agent.\",\n    modelingApproach:\"Retrieval-augmented generation over the versioned policy corpus, with a grounding contract.\",\n    modelTraining:\"No fine-tuning; the index is rebuilt nightly and evaluated against a held-out question set.\",\n    customerValue:\"Consistent answers, and a visible source the agent can quote back.\",\n    dataStrategy:\"Published policy documents only; customer text is never retained beyond the session.\"},\n  hiring:{init:\"hiring\",businessProblem:\"Recruiters cannot read every application for a high-volume requisition, so good candidates are missed.\",\n    businessValue:\"\",objectiveFunction:\"\",modelingApproach:\"\",modelTraining:\"\",\n    customerValue:\"\",dataStrategy:\"Application text and structured CV fields; special-category data is in scope and unresolved.\"},\n  forecast:{init:\"forecast\",businessProblem:\"Demand swings leave stock in the wrong region and the planning cycle cannot react inside a week.\",\n    businessValue:\"Lower carrying cost and fewer stock-outs against the same working capital.\",\n    objectiveFunction:\"\",modelingApproach:\"\",modelTraining:\"\",customerValue:\"\",dataStrategy:\"\"}\n};\nfunction canvasOf(id){ return CANVASES[id]||null; }\nfunction canvasMissing(c){ return CANVAS_BLOCKS.filter(function(b){ return !c||String(c[b.f]||\"\").trim()===\"\"; }).map(function(b){ return b.f; }); }\n\nvar IMPACTS = {\n  hiring:{init:\"hiring\",status:\"in-progress\",scope:\"Shortlisting support for external hiring across all requisitions in People / HR.\",\n    entries:[{harm:\"discrimination\",affected:\"groups\",likelihood:\"likely\",magnitude:\"severe\",description:\"Systematic under-shortlisting of candidates from a protected group.\"},\n             {harm:\"transparency\",affected:\"individuals\",likelihood:\"likely\",magnitude:\"major\",description:\"A rejected candidate cannot obtain the reason for the outcome.\"}]},\n  rcr:{init:\"rcr\",status:\"in-progress\",scope:\"Automated credit decisioning for retail applicants, with a human override path.\",\n    entries:[{harm:\"economic\",affected:\"individuals\",likelihood:\"possible\",magnitude:\"major\",description:\"Exclusion from credit following a mis-scored application.\"},\n             {harm:\"discrimination\",affected:\"groups\",likelihood:\"possible\",magnitude:\"major\",description:\"Disparate approval rates across protected attributes.\"}]},\n  chatbot:{init:\"chatbot\",status:\"signed-off\",scope:\"Front-line service assistance in the supervised pilot cohort only.\",\n    entries:[{harm:\"misinformation\",affected:\"individuals\",likelihood:\"possible\",magnitude:\"moderate\",description:\"A customer acts on an ungrounded answer given as fact.\"}]}\n};\n\n/* ---------- ARCHITECTURE: models, their system cards, and the diagrams ---------- */\nvar ALGORITHM_CLASSES = [\"LLM/NLP\",\"Computer Vision\",\"Forecasting\",\"Classification\",\"Recommender\",\n  \"Anomaly Detection\",\"Optimization\",\"Generative\",\"Speech\",\"RPA+AI\",\"Knowledge Graph\",\"Agentic\",\"Other (needs review)\"];\nvar STACK_CATEGORIES = [\"model\",\"vector-feature-store\",\"mlops-llmops\",\"guardrail\"];\nvar REFERENCE_CONFORMANCE = [\"deploying-on\",\"deviating\"];\nvar MODEL_STATUSES = [\"candidate\",\"in-use\",\"retired\"];\n\nvar MODELS = [\n  {id:\"md-credit\",name:\"Retail credit GBM\",version:\"3.2\",algorithm:\"Classification\",status:\"in-use\",\n   provider:\"In-house\",hosting:\"build-in-house\",conformance:\"deploying-on\",inits:[\"rcr\"],owner:\"jonah\",asset:\"as-fs\",supplier:null,\n   note:\"Gradient-boosted trees with a monotonic affordability constraint and a calibration layer.\"},\n  {id:\"md-fraud\",name:\"Fraud triage XGB\",version:\"7.0\",algorithm:\"Anomaly Detection\",status:\"in-use\",\n   provider:\"In-house\",hosting:\"build-in-house\",conformance:\"deploying-on\",inits:[\"fraud\"],owner:\"jonah\",asset:\"as-fs\",supplier:null,\n   note:\"Real-time scorer behind the review queue; thresholds tuned quarterly.\"},\n  {id:\"md-copilot\",name:\"Service copilot (hosted LLM)\",version:\"2026-06\",algorithm:\"LLM/NLP\",status:\"in-use\",\n   provider:\"Hyperscaler\",hosting:\"build-on-hyperscaler\",conformance:\"deviating\",inits:[\"chatbot\"],owner:\"maria\",asset:\"as-prompt\",supplier:null,\n   note:\"Hosted general-purpose model behind a grounding contract; deviates from the reference stack on hosting.\"},\n  {id:\"md-embed\",name:\"Document embedding model\",version:\"1.4\",algorithm:\"LLM/NLP\",status:\"in-use\",\n   provider:\"In-house\",hosting:\"build-in-house\",conformance:\"deploying-on\",inits:[\"chatbot\",\"rcr\",\"hiring\"],owner:\"leah\",asset:\"as-emb\",supplier:null,\n   note:\"The shared retrieval embeddings; the most reused model in the portfolio.\"},\n  {id:\"md-forecast\",name:\"ForecastCloud TS ensemble\",version:\"vendor\",algorithm:\"Forecasting\",status:\"candidate\",\n   provider:\"ForecastCloud AI\",hosting:\"buy-saas\",conformance:\"deviating\",inits:[\"forecast\"],owner:\"leah\",asset:\"as-conn\",supplier:\"sup-fc\",\n   note:\"Vendor ensemble evaluated before a pilot; weights are not inspectable.\"},\n  {id:\"md-ocr\",name:\"DocuParse OCR + layout\",version:\"vendor\",algorithm:\"Computer Vision\",status:\"candidate\",\n   provider:\"DocuParse\",hosting:\"buy-saas\",conformance:\"deviating\",inits:[\"docai\"],owner:\"leah\",asset:\"as-pipe\",supplier:\"sup-dp\",\n   note:\"Extraction stack under assessment; the page-limit defect was found here.\"},\n  {id:\"md-churn\",name:\"Churn propensity model\",version:\"2.1\",algorithm:\"Classification\",status:\"in-use\",\n   provider:\"In-house\",hosting:\"build-in-house\",conformance:\"deploying-on\",inits:[\"churn\"],owner:\"jonah\",asset:\"as-fs\",supplier:null,\n   note:\"Logistic baseline feeding retention campaigns; quarterly review.\"}\n];\n\n/* A system card is the model's own account of itself: intended use, what it was trained on, how it\n   was evaluated, where it fails and who watches it. Annex A.8 (information for interested parties)\n   and the EU AI Act Art.13 instructions-for-use land here. EVERY model has one; some are incomplete. */\nvar CARD_SECTIONS = [\n  {f:\"intendedUse\",l:\"Intended use\"},\n  {f:\"outOfScope\",l:\"Out-of-scope use\"},\n  {f:\"trainingData\",l:\"Training data and provenance\"},\n  {f:\"evaluation\",l:\"Evaluation and metrics\"},\n  {f:\"limitations\",l:\"Known limitations\"},\n  {f:\"oversight\",l:\"Human oversight\"}\n];\nvar SYSTEM_CARDS = {\n  \"md-credit\":{model:\"md-credit\",owner:\"jonah\",reviewed:\"2026-06-02\",\n    intendedUse:\"Score retail credit applications to support, never replace, an underwriter decision.\",\n    outOfScope:\"Commercial lending, collections prioritisation, and any use on an existing customer's held facility.\",\n    trainingData:\"36 months of internal account history plus bureau features; no special-category attributes.\",\n    evaluation:\"AUC 0.81 on a held-out quarter; calibration checked per decile; four-fifths disparity test per protected attribute.\",\n    limitations:\"Thin-file applicants are under-represented; performance degrades when rates move sharply.\",\n    oversight:\"Every decline above the threshold is reviewable by an underwriter, with reason codes.\"},\n  \"md-fraud\":{model:\"md-fraud\",owner:\"jonah\",reviewed:\"2026-07-01\",\n    intendedUse:\"Rank card transactions for human review in the fraud queue.\",\n    outOfScope:\"Automatic account closure or any customer-facing decision without a reviewer.\",\n    trainingData:\"Labelled fraud outcomes over 24 months, re-weighted for class imbalance.\",\n    evaluation:\"Precision/recall tracked weekly against the queue; false-positive complaints tracked separately.\",\n    limitations:\"Seasonal traffic shifts are under-represented between calibrations — the July spike came from this.\",\n    oversight:\"A human reviews every blocked transaction before it becomes a decision.\"},\n  \"md-copilot\":{model:\"md-copilot\",owner:\"maria\",reviewed:\"2026-06-30\",\n    intendedUse:\"Draft answers for a service agent from the published policy corpus, always with citations.\",\n    outOfScope:\"Direct customer contact, and any answer on a topic outside the indexed corpus.\",\n    trainingData:\"None — the hosted model is not fine-tuned; the retrieval index is rebuilt nightly.\",\n    evaluation:\"Citation-support rate on 800 sampled answers; an ungrounded set triaged by cause.\",\n    limitations:\"A stale document in the index produces a confident wrong answer — this happened in June.\",\n    oversight:\"The agent sends the answer, never the model; the source is shown beside it.\"},\n  \"md-embed\":{model:\"md-embed\",owner:\"leah\",reviewed:\"2026-05-11\",\n    intendedUse:\"Produce retrieval embeddings for internal document search across the portfolio.\",\n    outOfScope:\"Any use as a standalone decision signal, or on personal data outside the approved corpora.\",\n    trainingData:\"Open-weights base, adapted on internal document titles; no customer text.\",\n    evaluation:\"Recall@10 on a curated retrieval set, per consuming initiative.\",\n    limitations:\"Domain drift as the corpus grows; no per-tenant isolation of the index.\",\n    oversight:\"Consumers must show the retrieved source alongside any generated text.\"},\n  \"md-forecast\":{model:\"md-forecast\",owner:\"leah\",reviewed:\"2026-05-22\",\n    intendedUse:\"Produce regional demand forecasts for the planning cycle.\",\n    outOfScope:\"Any pricing or staffing decision taken directly from the forecast.\",\n    trainingData:\"\",\n    evaluation:\"\",\n    limitations:\"Vendor ensemble — weights and training data are not inspectable.\",\n    oversight:\"Planner reviews every forecast before it enters the cycle.\"},\n  \"md-ocr\":{model:\"md-ocr\",owner:\"leah\",reviewed:\"2026-05-30\",\n    intendedUse:\"Extract structured fields from back-office documents.\",\n    outOfScope:\"Any contract interpretation, and any extraction that becomes a record without review.\",\n    trainingData:\"\",\n    evaluation:\"Field-level accuracy on a 500-document sample.\",\n    limitations:\"Multi-page contracts were silently truncated by a vendor page-limit default.\",\n    oversight:\"\"},\n  \"md-churn\":{model:\"md-churn\",owner:\"jonah\",reviewed:\"2026-04-18\",\n    intendedUse:\"Rank customers by retention propensity for campaign targeting.\",\n    outOfScope:\"Any pricing, credit or service-level difference based on the score.\",\n    trainingData:\"18 months of behavioural features from the customer feature store.\",\n    evaluation:\"Lift over random targeting, reviewed quarterly.\",\n    limitations:\"Correlates with tenure, so new customers are systematically under-ranked.\",\n    oversight:\"Campaign owner approves every audience before send.\"}\n};\nfunction cardOf(modelId){ return SYSTEM_CARDS[modelId]||null; }\nfunction cardMissing(c){ return CARD_SECTIONS.filter(function(s){ return !c||String(c[s.f]||\"\").trim()===\"\"; }).map(function(s){ return s.f; }); }\nfunction modelsOf(initId){ return MODELS.filter(function(m){ return m.inits.indexOf(initId)!==-1; }); }\n\n/* Real Mermaid source, rendered by the small built-in engine below rather than a CDN script:\n   the prototype must open from file:// with no network, and an unpinned remote script is exactly\n   what A03 forbids. The source is the canonical artefact; the drawing is derived from it. */\nvar DIAGRAMS = {\n  rcr:\"flowchart LR\\n  APP([Application intake]) --> FS[(Customer feature store)]\\n  BUR[(Bureau feed)] --> FS\\n  FS --> SC[Credit GBM scorer]\\n  SC -->|score + reasons| CAL[Calibration + reason codes]\\n  CAL --> DEC{{Underwriter review}}\\n  DEC -->|decision| CORE[Core banking decision]\\n  SC -.->|weekly| MON[Drift + disparity monitor]\\n  MON --> ALERT([Model risk alert])\",\n  fraud:\"flowchart LR\\n  TXN([Card transaction stream]) --> FS[(Customer feature store)]\\n  FS --> XGB[Fraud triage XGB]\\n  XGB --> THR[Threshold + queue ranking]\\n  THR --> REV{{Human review queue}}\\n  REV --> ACT[Block or release]\\n  XGB --> PMM[Post-market monitoring]\",\n  chatbot:\"flowchart LR\\n  DOC[(Policy corpus)] --> IDX[Nightly index build]\\n  IDX --> EMB[Document embedding model]\\n  EMB --> VEC[(Vector store)]\\n  Q([Agent question]) --> RET[Retriever]\\n  VEC --> RET\\n  RET --> LLM[Hosted LLM]\\n  LLM --> GRD[Grounding + citation guard]\\n  GRD --> AGT{{Service agent}}\",\n  forecast:\"flowchart LR\\n  ERP[(ERP demand history)] --> CONN[ForecastCloud connector]\\n  CONN --> VEND[Vendor TS ensemble]\\n  VEND --> OUT[Regional forecast]\\n  OUT --> PLAN{{Planner review}}\\n  PLAN --> CYCLE[Planning cycle]\",\n  docai:\"flowchart LR\\n  SCAN([Scanned documents]) --> PIPE[Document ingest pipeline]\\n  PIPE --> OCR[DocuParse OCR + layout]\\n  OCR --> EXT[Field extraction]\\n  EXT --> QA{{Back-office check}}\\n  QA --> REC[(Record of decision)]\"\n};\n\n/* ---------- DATA: sources, and the pipelines they feed ---------- */\n/* data-source-taxonomy.ts: a controlled set of 20 categories, each carrying a sensitivity and a\n   personal-data flag. Selection is enumerated, never free text, and the personal-data flag is what\n   pulls an initiative into DPIA scope. */\nvar DATA_SOURCE_CATEGORIES = {\n  \"CRM\":{sensitivity:\"medium\",personalData:true},\n  \"HR / employee records\":{sensitivity:\"high\",personalData:true},\n  \"Financial transactions\":{sensitivity:\"high\",personalData:true},\n  \"Web analytics / clickstream\":{sensitivity:\"medium\",personalData:true},\n  \"Supply chain / logistics\":{sensitivity:\"low\",personalData:false},\n  \"Third-party / purchased data\":{sensitivity:\"high\",personalData:true},\n  \"Documents / knowledge base\":{sensitivity:\"medium\",personalData:false},\n  \"Images / media\":{sensitivity:\"medium\",personalData:false},\n  \"Payment / cardholder\":{sensitivity:\"high\",personalData:true}\n};\nvar DATASOURCES = [\n  {id:\"ds-core\",name:\"Core banking accounts\",category:\"Financial transactions\",system:\"Core banking\",feeds:[\"as-fs\"]},\n  {id:\"ds-bureau\",name:\"Credit bureau feed\",category:\"Third-party / purchased data\",system:\"Bureau API\",feeds:[\"as-fs\"]},\n  {id:\"ds-cards\",name:\"Card transaction stream\",category:\"Payment / cardholder\",system:\"Card switch\",feeds:[\"as-fs\"]},\n  {id:\"ds-crm\",name:\"CRM customer profile\",category:\"CRM\",system:\"CRM\",feeds:[\"as-fs\"]},\n  {id:\"ds-web\",name:\"Web clickstream\",category:\"Web analytics / clickstream\",system:\"Analytics platform\",feeds:[\"as-fs\"]},\n  {id:\"ds-policy\",name:\"Policy document corpus\",category:\"Documents / knowledge base\",system:\"Document management\",feeds:[\"as-emb\"]},\n  {id:\"ds-cvs\",name:\"Applicant CVs\",category:\"HR / employee records\",system:\"Applicant tracking\",feeds:[\"as-emb\"]},\n  {id:\"ds-erp\",name:\"ERP demand history\",category:\"Supply chain / logistics\",system:\"ERP\",feeds:[\"as-conn\"]},\n  {id:\"ds-scans\",name:\"Scanned back-office documents\",category:\"Images / media\",system:\"Scanning bureau\",feeds:[\"as-pipe\"]}\n];\n/* Initiative.dataSources, as the domain holds it. */\nvar INIT_SOURCES = {rcr:[\"ds-core\",\"ds-bureau\"],fraud:[\"ds-cards\",\"ds-core\"],churn:[\"ds-crm\",\"ds-web\"],\n  chatbot:[\"ds-policy\"],hiring:[\"ds-cvs\"],forecast:[\"ds-erp\"],docai:[\"ds-scans\"],pricing:[]};\nfunction sourcesOf(initId){ return (INIT_SOURCES[initId]||[]).map(function(id){ return byId(DATASOURCES,id); }).filter(Boolean); }\nfunction sourceProfile(ds){ return DATA_SOURCE_CATEGORIES[ds.category]||{sensitivity:\"medium\",personalData:false}; }\nfunction assetIdsOf(initId){ var i=initiative(initId); return i?i.assets.map(function(a){ return a[0]; }):[]; }\n\n/** One initiative's data pipeline, DERIVED from the graph rather than drawn by hand: its sources\n *  feed the shared assets it uses, those carry the models that serve it, and the models serve it.\n *  A source that feeds none of its assets goes straight to its models, so nothing is dropped. */\nfunction pipelineOf(initId){\n  var nodes={}, edges={};\n  function node(key,kind,label,ref){ nodes[key]=nodes[key]||{key:key,kind:kind,label:label,ref:ref}; return key; }\n  function edge(a,b){ edges[a+\">\"+b]={a:a,b:b}; }\n  var i=initiative(initId); if(!i) return {nodes:{},edges:{}};\n  var consumer=node(\"init_\"+initId,\"initiative\",i.title,initId);\n  var assets=assetIdsOf(initId), models=modelsOf(initId);\n  sourcesOf(initId).forEach(function(ds){\n    var s=node(\"ds_\"+ds.id,\"datasource\",ds.name,ds.id);\n    var fed=ds.feeds.filter(function(a){ return assets.indexOf(a)!==-1; });\n    if(fed.length) fed.forEach(function(a){ edge(s, node(\"as_\"+a,\"asset\",byId(ASSETS,a).name,a)); });\n    else if(models.length) models.forEach(function(m){ edge(s, node(\"md_\"+m.id,\"model\",m.name,m.id)); });\n    else edge(s,consumer);\n  });\n  assets.forEach(function(a){\n    var ak=node(\"as_\"+a,\"asset\",byId(ASSETS,a).name,a);\n    var carried=models.filter(function(m){ return m.asset===a; });\n    if(carried.length) carried.forEach(function(m){ edge(ak, node(\"md_\"+m.id,\"model\",m.name,m.id)); });\n    else edge(ak,consumer);\n  });\n  models.forEach(function(m){ edge(node(\"md_\"+m.id,\"model\",m.name,m.id), consumer); });\n  return {nodes:nodes,edges:edges};\n}\n/** The union of several pipelines, with every node that two or more of them share marked. The\n *  shared nodes are the point of the view: they are the consolidation candidates and the blast\n *  radius at once, and a shared node carrying personal data widens DPIA scope for all of them. */\nfunction combinedPipeline(initIds){\n  var nodes={}, edges={}, users={};\n  initIds.forEach(function(id){\n    var p=pipelineOf(id);\n    Object.keys(p.nodes).forEach(function(k){ nodes[k]=p.nodes[k]; (users[k]=users[k]||[]).push(id); });\n    Object.keys(p.edges).forEach(function(k){ edges[k]=p.edges[k]; });\n  });\n  var shared=Object.keys(users).filter(function(k){ return nodes[k].kind!==\"initiative\" && users[k].length>1; });\n  return {nodes:nodes,edges:edges,users:users,shared:shared};\n}\nvar PIPE_SHAPE = {datasource:[\"[(\",\")]\"],asset:[\"[\",\"]\"],model:[\"[\",\"]\"],initiative:[\"([\",\"])\"]};\nfunction mmdLabel(t){ return String(t).replace(/[\\[\\](){}|\"<>]/g,\" \").replace(/\\s+/g,\" \").trim(); }\n/** Emit the combined pipeline as Mermaid, so the view is the same artefact as a diagram: the\n *  engine that draws it is the one the editor validates against. */\nfunction pipelineMermaid(pipe){\n  var lines=[\"flowchart LR\"];\n  Object.keys(pipe.nodes).forEach(function(k){\n    var n=pipe.nodes[k], sh=PIPE_SHAPE[n.kind];\n    lines.push(\"  \"+k+sh[0]+mmdLabel(n.label)+sh[1]);\n  });\n  Object.keys(pipe.edges).forEach(function(k){ var e=pipe.edges[k]; lines.push(\"  \"+e.a+\" --> \"+e.b); });\n  var pii=Object.keys(pipe.nodes).filter(function(k){ var n=pipe.nodes[k];\n    return n.kind===\"datasource\" && sourceProfile(byId(DATASOURCES,n.ref)).personalData; });\n  if(pipe.shared.length) lines.push(\"  class \"+pipe.shared.join(\",\")+\" shared\");\n  if(pii.length) lines.push(\"  class \"+pii.join(\",\")+\" pii\");\n  return lines.join(\"\\n\");\n}\n\n/* ---------- TECHNOLOGY RISK: derived from the incidents actually logged ---------- */\n/* The technical subset of INCIDENT_CLASSIFICATIONS. rights-impact is about people and \"other\" is\n   unclassified; neither is a technology risk, and pretending otherwise would pad the view. */\nvar TECH_RISKS = [\n  {id:\"security\",label:\"Security\",classification:\"security-breach\",harm:\"security\",\n   explain:\"Adversarial manipulation, injection, leakage across boundaries, model theft.\"},\n  {id:\"drift\",label:\"Drift & performance\",classification:\"performance-drift\",harm:\"safety\",\n   explain:\"A model whose world has moved on: its inputs or its outcomes no longer match what it learned.\"},\n  {id:\"reliability\",label:\"Malfunction & reliability\",classification:\"malfunction\",harm:null,\n   explain:\"The system does not do what it was built to do — latency, truncation, silent failure.\"},\n  {id:\"output\",label:\"Harmful output\",classification:\"harmful-output\",harm:\"misinformation\",\n   explain:\"The system does what it was built to do, and what it says is wrong or harmful.\"}\n];\nfunction techRisk(id){ return byId(TECH_RISKS,id); }\nfunction techIncidents(tr){ return INCIDENTS.filter(function(n){ return n.classification===tr.classification; }); }\nfunction techModels(tr){ var seen={}; techIncidents(tr).forEach(function(n){ if(n.model) seen[n.model]=1; }); return Object.keys(seen); }\nfunction techInits(tr){ var seen={}; techIncidents(tr).forEach(function(n){ seen[n.init]=1; }); return Object.keys(seen); }\n/** An incident that traces to no risk is a gap in the register, not a quiet success: the thing\n *  happened and nobody had written down that it could. */\nfunction techGaps(tr){ return techIncidents(tr).filter(function(n){ return !n.risk; }); }\nfunction techLevel(tr){\n  var open=techIncidents(tr).filter(function(n){ return n.status===\"open\"; });\n  if(open.length && techGaps(tr).some(function(n){ return n.status===\"open\"; })) return \"high\";\n  if(open.length>1) return \"high\";\n  if(open.length) return \"medium\";\n  return \"low\";\n}\n\n/* Saved versions of each diagram, newest last. Undo pops one; nothing is ever silently lost. */\nvar DIAGRAM_HISTORY = {};\n\n/* ---------- DELIVERY: budget, sourcing strategy, change management, waves ---------- */\n/* Investment splits follow investment.ts: technology / data / people-process against the canonical\n   10/20/70 target. People-process IS the change-management budget, which is why under-investing\n   there is the signal rather than a separate opinion. Figures are k-currency. */\nvar BUDGETS = {\n  rcr:{total:1850,split:{technology:520,data:410,peopleProcess:920},spent:{technology:480,data:390,peopleProcess:310}},\n  fraud:{total:1240,split:{technology:250,data:210,peopleProcess:780},spent:{technology:250,data:205,peopleProcess:700}},\n  forecast:{total:640,split:{technology:300,data:190,peopleProcess:150},spent:{technology:90,data:60,peopleProcess:20}},\n  hiring:{total:410,split:{technology:150,data:110,peopleProcess:150},spent:{technology:20,data:10,peopleProcess:15}},\n  chatbot:{total:1420,split:{technology:430,data:260,peopleProcess:730},spent:{technology:380,data:240,peopleProcess:395}},\n  churn:{total:520,split:{technology:120,data:90,peopleProcess:310},spent:{technology:120,data:90,peopleProcess:295}},\n  docai:{total:780,split:{technology:330,data:250,peopleProcess:200},spent:{technology:140,data:120,peopleProcess:45}},\n  pricing:{total:180,split:{technology:80,data:60,peopleProcess:40},spent:{technology:5,data:0,peopleProcess:0}}\n};\nvar INVESTMENT_TARGET = {technology:0.10,data:0.20,peopleProcess:0.70};\nfunction budgetOf(id){ return BUDGETS[id]||null; }\nfunction shareOf(b,k){ return b&&b.total?b.split[k]/b.total:0; }\n/** investment.ts's AC3: people-process starved relative to the 70% target. Advisory. */\nfunction underInvested(b){ return shareOf(b,\"peopleProcess\") < INVESTMENT_TARGET.peopleProcess; }\nfunction spentTotal(b){ return b?b.spent.technology+b.spent.data+b.spent.peopleProcess:0; }\n\n/* The sourcing STRATEGY, not just the mode: the mode is a label, the rationale is the decision. */\nvar SOURCING = {\n  rcr:{mode:\"build-in-house\",rationale:\"The scoring logic is the lending policy — it has to be inspectable and defensible in an appeal, so it is not bought.\"},\n  fraud:{mode:\"build-in-house\",rationale:\"Built on the same feature store as credit; the marginal cost of building was lower than integrating a vendor.\"},\n  forecast:{mode:\"buy-saas\",rationale:\"Forecasting is not a differentiator here. Bought, on condition the residency clause is resolved.\"},\n  hiring:{mode:\"partner-co-build\",rationale:\"Co-build with a partner who has the assessment science; the legal exposure stays with us, which is the open question.\"},\n  chatbot:{mode:\"build-on-hyperscaler\",rationale:\"The model is rented, the grounding contract and the corpus are ours — the part that carries the risk stays in-house.\"},\n  churn:{mode:\"build-in-house\",rationale:\"A small model on data we already hold; buying would have cost more than it saved.\"},\n  docai:{mode:\"buy-saas\",rationale:\"Commodity extraction. Bought for speed, with the review step kept because the vendor cannot be inspected.\"},\n  pricing:{mode:\"build-in-house\",rationale:\"No decision yet — recorded as in-house by default until the first screen.\"}\n};\nfunction sourcingOf(id){ return SOURCING[id]||null; }\n\nvar AMBITIONS = [\"Deploy\",\"Reshape\",\"Invent\"];\nvar ADKAR_STATES = [\"awareness\",\"desire\",\"knowledge\",\"ability\",\"reinforcement\"];\nvar ADKAR_WEAKNESS_THRESHOLD = 40;\nvar CHANGE_LOAD_ORDINAL = {low:1,moderate:2,high:3,transformational:4};\nvar AMBITION_LOAD = {Deploy:\"moderate\",Reshape:\"high\",Invent:\"transformational\"};\n/** adkarLoadBand: the weaker the limiting state, the more change must be absorbed. The\n *  moderate->high step sits exactly at ADKAR_WEAKNESS_THRESHOLD, so any at-risk initiative\n *  carries at least 'high' load. change-load-profile.ts. */\nfunction adkarLimitingScore(a){ return Math.min.apply(null, ADKAR_STATES.map(function(s){ return a[s]; })); }\nfunction adkarLoadBand(a){ var w=adkarLimitingScore(a); return w>=60?\"low\":w>=40?\"moderate\":w>=20?\"high\":\"transformational\"; }\nfunction assessAdkar(a){\n  var weak=ADKAR_STATES.filter(function(s){ return a[s]<ADKAR_WEAKNESS_THRESHOLD; });\n  var lim=adkarLimitingScore(a);\n  return {limitingState:ADKAR_STATES.filter(function(s){ return a[s]===lim; })[0], limitingScore:lim, weakStates:weak, atRisk:weak.length>0};\n}\n/** CC6 CONTRACT: the ambition band (the PLAN) and the ADKAR band (the STATE) are independent\n *  dimensions. They are read separately and MUST NOT be fused into one surfaced band. An\n *  ephemeral max-severity ordinal for sequencing is allowed; a fused band is not. */\nfunction changeLoad(ch){ return {ambitionLoad:AMBITION_LOAD[ch.ambition], adkarLoad:adkarLoadBand(ch.adkar)}; }\nfunction changeSeverity(ch){ var p=changeLoad(ch);\n  return Math.max(CHANGE_LOAD_ORDINAL[p.ambitionLoad]||0, CHANGE_LOAD_ORDINAL[p.adkarLoad]||0); }\n\nvar CHANGE = {\n  rcr:{init:\"rcr\",owner:\"david\",ambition:\"Reshape\",adkar:{awareness:85,desire:60,knowledge:55,ability:30,reinforcement:10},\n    interventions:[\"Underwriter shadow-scoring week\",\"Reason-code reading guide for servicing\",\"Floor-walker support for the first two weeks\"]},\n  fraud:{init:\"fraud\",owner:\"priya\",ambition:\"Deploy\",adkar:{awareness:90,desire:80,knowledge:75,ability:70,reinforcement:60},\n    interventions:[\"Queue-triage refresher\",\"Monthly false-positive clinic\"]},\n  forecast:{init:\"forecast\",owner:\"david\",ambition:\"Deploy\",adkar:{awareness:50,desire:40,knowledge:25,ability:15,reinforcement:5},\n    interventions:[\"Planner briefing on what the ensemble can and cannot see\"]},\n  hiring:{init:\"hiring\",owner:\"sam\",ambition:\"Reshape\",adkar:{awareness:30,desire:20,knowledge:10,ability:5,reinforcement:0},\n    interventions:[]},\n  chatbot:{init:\"chatbot\",owner:\"sam\",ambition:\"Reshape\",adkar:{awareness:70,desire:65,knowledge:50,ability:45,reinforcement:20},\n    interventions:[\"Agent coaching sprint\",\"Citation-reading habit card\",\"Escalation path rehearsal\"]},\n  churn:{init:\"churn\",owner:\"sam\",ambition:\"Deploy\",adkar:{awareness:88,desire:82,knowledge:80,ability:72,reinforcement:65},\n    interventions:[\"Campaign-owner sign-off routine\"]},\n  docai:{init:\"docai\",owner:\"david\",ambition:\"Deploy\",adkar:{awareness:45,desire:35,knowledge:30,ability:20,reinforcement:10},\n    interventions:[\"Back-office check-step walkthrough\"]},\n  pricing:{init:\"pricing\",owner:\"sam\",ambition:\"Invent\",adkar:{awareness:20,desire:10,knowledge:5,ability:0,reinforcement:0},\n    interventions:[]}\n};\nfunction changeOf(id){ return CHANGE[id]||null; }\n\n/* A Wave is a delivery slice with a timeline, a description and objectives whose achievement is\n   DERIVED from delivery, never typed in. Capacity is wave-sequencing.ts's DEFAULT_WAVE_CAPACITY. */\nvar DEFAULT_WAVE_CAPACITY = 6;\nvar SATURATION_THRESHOLD = 2;\nvar WAVES = [\n  {n:1,name:\"Prove it\",start:\"2026-01\",end:\"2026-06\",lead:\"david\",\n   description:\"Take the two use cases that already have data and a willing owner all the way to production, and learn what the governance gate actually costs in practice.\",\n   objectives:[\n     {id:\"w1-o1\",text:\"Cut retail credit decision time to under an hour\",measure:\"median time to decision\",contributors:[\"rcr\"]},\n     {id:\"w1-o2\",text:\"Run fraud triage in production with a human queue\",measure:\"queue live, monitored weekly\",contributors:[\"fraud\"]},\n     {id:\"w1-o3\",text:\"Prove the retention model pays for itself\",measure:\"lift over random targeting\",contributors:[\"churn\"]}\n   ]},\n  {n:2,name:\"Scale the wins\",start:\"2026-07\",end:\"2026-12\",lead:\"maria\",\n   description:\"Extend what worked into the service and back-office estate, where the change load lands on far more people than the first wave did.\",\n   objectives:[\n     {id:\"w2-o1\",text:\"Put a grounded assistant in front of every service agent\",measure:\"agents with the assistant in daily use\",contributors:[\"chatbot\"]},\n     {id:\"w2-o2\",text:\"Automate back-office document intake\",measure:\"share of documents extracted without rekeying\",contributors:[\"docai\"]},\n     {id:\"w2-o3\",text:\"Decide build-or-buy on demand forecasting\",measure:\"sourcing decision recorded\",contributors:[\"forecast\"]}\n   ]},\n  {n:3,name:\"New ground\",start:\"2027-01\",end:\"2027-06\",lead:\"sam\",\n   description:\"The two initiatives that need something the organisation does not have yet — a defensible hiring assessment, and a pricing capability nobody has run before.\",\n   objectives:[\n     {id:\"w3-o1\",text:\"Reach a defensible position on AI in hiring\",measure:\"FRIA and bias audit complete and signed off\",contributors:[\"hiring\"]},\n     {id:\"w3-o2\",text:\"Establish a pricing capability\",measure:\"first pricing model through the gate\",contributors:[\"pricing\"]}\n   ]}\n];\nvar WAVE_PIN = {rcr:1,fraud:1,churn:1,chatbot:2,docai:2,forecast:2,hiring:3,pricing:3};\nfunction waveOf(initId){ return byId(WAVES, WAVE_PIN[initId], \"n\"); }\nfunction waveItems(n){ return INITIATIVES.filter(function(i){ return WAVE_PIN[i.id]===n; }); }\n/** Objective achievement is DERIVED from delivery: the share of its contributing initiatives that\n *  have reached Run. A typed-in percentage would be an opinion; this is a consequence. */\nfunction objectiveProgress(o){\n  var done=o.contributors.filter(function(id){ var i=initiative(id); return i&&i.stage===\"Run\"; }).length;\n  return {done:done, total:o.contributors.length, pct:o.contributors.length?Math.round(done/o.contributors.length*100):0};\n}\nfunction waveCost(n){ return waveItems(n).reduce(function(a,i){ var b=budgetOf(i.id); return a+(b?b.total:0); },0); }\nfunction waveSpent(n){ return waveItems(n).reduce(function(a,i){ return a+spentTotal(budgetOf(i.id)); },0); }\nfunction waveChangeBudget(n){ return waveItems(n).reduce(function(a,i){ var b=budgetOf(i.id); return a+(b?b.split.peopleProcess:0); },0); }\nfunction waveLoad(n){ return waveItems(n).reduce(function(a,i){ var ch=changeOf(i.id); return a+Math.max(ch?changeSeverity(ch):0,1); },0); }\nfunction waveUnits(n){ var seen={}; waveItems(n).forEach(function(i){ seen[i.bu]=(seen[i.bu]||0)+1; }); return seen; }\n/** saturation.ts: warn where a business unit carries more than the threshold of HIGH-change\n *  initiatives in one wave. Advisory, never blocking, and it names the contributors. */\nfunction waveSaturation(n){\n  var by={};\n  waveItems(n).forEach(function(i){ var ch=changeOf(i.id); if(ch&&changeSeverity(ch)>=3){ (by[i.bu]=by[i.bu]||[]).push(i); } });\n  return Object.keys(by).filter(function(bu){ return by[bu].length>SATURATION_THRESHOLD; })\n    .map(function(bu){ return {bu:bu,count:by[bu].length,threshold:SATURATION_THRESHOLD,contributors:by[bu]}; });\n}\n\nvar ASSETS = [\n  {id:\"as-emb\",kind:\"model\",name:\"Document embedding service\",note:\"Shared retrieval embeddings; the most reused asset in the portfolio.\"},\n  {id:\"as-fs\",kind:\"feature-store\",name:\"Customer feature store\",note:\"Shared customer features across credit, fraud and retention models.\"},\n  {id:\"as-prompt\",kind:\"prompt\",name:\"Service copilot prompt set\",note:\"Versioned prompt templates with the grounding contract.\"},\n  {id:\"as-conn\",kind:\"connector\",name:\"ForecastCloud connector\",note:\"Vendor ingest connector; carries the residency question.\"},\n  {id:\"as-pipe\",kind:\"pipeline\",name:\"Document ingest pipeline\",note:\"OCR + extraction pipeline feeding the back-office record.\"}\n];\n\nvar SUPPLIERS = [\n  {id:\"sup-fc\",name:\"ForecastCloud AI\",mode:\"buy-saas\",posture:\"High\",note:\"High bias band and moderate data-rights terms; responsibility shared.\",control:\"A.10\"},\n  {id:\"sup-dp\",name:\"DocuParse\",mode:\"buy-saas\",posture:\"Medium\",note:\"Extraction vendor; residency confirmed, page-limit defect logged.\",control:\"A.10\"},\n  {id:\"sup-tr\",name:\"TalentRank Partners\",mode:\"partner-co-build\",posture:\"High\",note:\"Co-build partner on the held hiring use case; no assessment on file.\",control:\"A.10\"}\n];\n\nvar REGS = [\n  {id:\"eu-ai-act\",name:\"EU AI Act\",kind:\"Regulation\",relevance:\"Applies — high-risk (Annex III) obligations\",requires:[\"A.5\",\"A.6\",\"A.8\",\"A.9\"]},\n  {id:\"gdpr\",name:\"GDPR\",kind:\"Regulation\",relevance:\"Applies — personal data in credit, HR and document use cases\",requires:[\"A.7\"]},\n  {id:\"iso-42001\",name:\"ISO/IEC 42001\",kind:\"Framework\",relevance:\"Adopted as the AIMS baseline\",requires:[\"A.2\",\"A.3\",\"A.4\",\"A.6\",\"A.10\"]},\n  {id:\"iso-23894\",name:\"ISO/IEC 23894\",kind:\"Framework\",relevance:\"Risk process reference\",requires:[\"A.5\",\"A.6\"]},\n  {id:\"iso-42005\",name:\"ISO/IEC 42005\",kind:\"Framework\",relevance:\"Impact-assessment reference\",requires:[\"A.5\"]}\n];\n\n/* ===================== helpers ===================== */\nfunction esc(s){ return String(s===undefined||s===null?\"\":s).replace(/[&<>\"]/g,function(c){return {\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c];}); }\nfunction byId(arr,id,key){ key=key||\"id\"; for(var i=0;i<arr.length;i++){ if(arr[i][key]===id) return arr[i]; } return null; }\nfunction initiative(id){ return byId(INITIATIVES,id); }\nfunction initials(n){ return n.split(\" \").map(function(p){return p[0];}).slice(0,2).join(\"\").toUpperCase(); }\nfunction pcolor(n){ var hues=[210,165,35,280,340,195,95],s=0; for(var i=0;i<n.length;i++) s+=n.charCodeAt(i); return \"hsl(\"+hues[s%hues.length]+\" 45% 42%)\"; }\nfunction avatar(p,size){ return '<span class=\"avatar'+(size?\" \"+size:\"\")+'\" data-ring=\"'+p.ring+'\" style=\"background:'+pcolor(p.name)+'\" aria-hidden=\"true\">'+initials(p.name)+'<\u002Fspan>'; }\nfunction personChip(p){ return '<button class=\"person-chip\" type=\"button\" data-open=\"person:'+p.id+'\">'+avatar(p,\"sm\")+\n  '<span class=\"who\"><b>'+esc(p.name)+'<\u002Fb><span>'+esc(p.role)+'<\u002Fspan><\u002Fspan><\u002Fbutton>'; }\nfunction ragBadge(level){ var lbl=level.charAt(0).toUpperCase()+level.slice(1); return '<span class=\"rag\" data-level=\"'+level+'\"><span class=\"rag-dot\"><\u002Fspan>'+lbl+'<\u002Fspan>'; }\nfunction tierTone(t){ return t===\"Unacceptable\"?\"red\":t===\"High\"?\"red\":t===\"Needs review\"?\"amber\":t===\"Limited\"?\"amber\":\"green\"; }\nfunction levelOf(r){ return riskLevel(r.likelihood,r.severity); }\nfunction fact(k,v){ return '<div class=\"fact\"><dt>'+esc(k)+'<\u002Fdt><dd>'+v+'<\u002Fdd><\u002Fdiv>'; }\nfunction titleCase(s){ return String(s).replace(/-/g,\" \").replace(/^./,function(c){return c.toUpperCase();}); }\nfunction pname(id){ return PEOPLE[id]?PEOPLE[id].name:\"—\"; }\nfunction money(k){ return k>=1000?\"€\"+(k/1000).toFixed(1)+\"M\":\"€\"+k+\"k\"; }\nfunction pct(n,d){ return d?Math.round(n/d*100):0; }\n\n/* ===================== THE ONTOLOGY =====================\n   One declaration. The right rail, the drill modals and the add-forms all render\n   from it, which is what stops the navigation and the detail drifting into two\n   different graphs. Full table: docs/design/P1.2-ONTOLOGY.md.\n   `edges` are typed and directional; each names the inverse that makes the walk\n   reversible — an inverse that is not declared does not exist. */\nvar ONTOLOGY = {\n  initiative:{\n    label:\"Initiative\", plural:\"Initiatives\", accent:\"gov\", record:true,\n    route:function(id){ return \"#/initiative/\"+id; },\n    get:function(id){ return initiative(id); },\n    all:function(){ return INITIATIVES.slice(); },\n    title:function(o){ return o.title; },\n    meta:function(o){ return o.stage; },\n    sub:function(o){ return o.bu+\" · \"+o.stage+\" stage\"; },\n    explain:\"An Initiative is the unit everything else hangs off: it is owned and sponsored by people, carries risks, suffers incidents, is built on shared assets, and is governed by the regulations its classification pulls in.\",\n    badges:function(o){ return '<span class=\"stage-badge\">'+o.stage+'<\u002Fspan><span class=\"pill\" data-tone=\"'+tierTone(o.tier)+'\">'+esc(o.tier)+' tier<\u002Fspan><span class=\"pill\" data-tone=\"'+o.dispTone+'\">'+esc(o.disp)+'<\u002Fspan>'; },\n    facts:[\n      [\"Summary\",function(o){ return esc(o.summary); }],\n      [\"Business unit\",function(o){ return esc(o.bu); }],\n      [\"Lifecycle stage\",function(o){ return esc(o.stage); }],\n      [\"Risk tier\",function(o){ return '<span class=\"pill\" data-tone=\"'+tierTone(o.tier)+'\">'+esc(o.tier)+'<\u002Fspan>'; }],\n      [\"Disposition\",function(o){ return '<span class=\"pill\" data-tone=\"'+o.dispTone+'\">'+esc(o.disp)+'<\u002Fspan>'; }],\n      [\"Sourcing mode\",function(o){ return esc(titleCase(o.sourcing)); }],\n      [\"Value state\",function(o){ return esc(o.value); }]\n    ],\n    edges:[\n      {via:\"is owned by\", inv:\"owns\", to:\"person\", ids:function(o){ return [o.owner]; }},\n      {via:\"is sponsored by\", inv:\"sponsors\", to:\"person\", ids:function(o){ return [o.sponsor]; }},\n      {via:\"carries\", inv:\"is carried by\", to:\"risk\", ids:function(o){ return RISKS.filter(function(r){return r.init===o.id;}).map(function(r){return r.id;}); }},\n      {via:\"has suffered\", inv:\"occurred on\", to:\"incident\", ids:function(o){ return INCIDENTS.filter(function(n){return n.init===o.id;}).map(function(n){return n.id;}); }},\n      {via:\"is assessed by\", inv:\"assesses\", to:\"impact\", ids:function(o){ return IMPACTS[o.id]?[o.id]:[]; }},\n      {via:\"was decided in\", inv:\"decides on\", to:\"decision\", ids:function(o){ return DECISIONS.filter(function(d){return d.init===o.id;}).map(function(d){return d.id;}); }},\n      {via:\"is built on\", inv:\"is used by\", to:\"asset\", ids:function(o){ return o.assets.map(function(a){return a[0];}); }},\n      {via:\"is sourced from\", inv:\"supplies\", to:\"supplier\", ids:function(o){ return o.supplier?[o.supplier]:[]; }},\n      {via:\"is governed by\", inv:\"applies to\", to:\"regulation\", ids:function(o){ return o.regs; }},\n      {via:\"is defined by\", inv:\"defines\", to:\"canvas\", ids:function(o){ return canvasOf(o.id)?[o.id]:[]; }},\n      {via:\"was reviewed at\", inv:\"reviewed\", to:\"meeting\", ids:function(o){ return MEETINGS.filter(function(m){return m.reviewed.indexOf(o.id)!==-1;}).map(function(m){return m.id;}); }},\n      {via:\"runs on\", inv:\"serves\", to:\"model\", ids:function(o){ return modelsOf(o.id).map(function(m){ return m.id; }); }},\n      {via:\"has a change programme\", inv:\"is the change side of\", to:\"change\", ids:function(o){ return changeOf(o.id)?[o.id]:[]; }},\n      {via:\"is delivered in\", inv:\"delivers\", to:\"wave\", ids:function(o){ var w=waveOf(o.id); return w?[String(w.n)]:[]; }},\n      {via:\"consumes\", inv:\"is consumed by\", to:\"datasource\", ids:function(o){ return INIT_SOURCES[o.id]||[]; }},\n      {via:\"is described by\", inv:\"describes\", to:\"diagram\", ids:function(o){ return DIAGRAMS[o.id]?[o.id]:[]; }},\n      {via:\"is exposed to\", inv:\"affects\", to:\"techrisk\", ids:function(o){\n        return TECH_RISKS.filter(function(t){ return techInits(t).indexOf(o.id)!==-1; }).map(function(t){ return t.id; }); }}\n    ],\n    acts:[\"risk\",\"incident\",\"decision\",\"evidence\",\"canvas\"]\n  },\n\n  person:{\n    label:\"Person\", plural:\"People\", accent:\"arch\", record:true,\n    route:function(id){ return \"#/person/\"+id; },\n    get:function(id){ return PEOPLE[id]||null; },\n    all:function(){ return Object.keys(PEOPLE).map(function(k){return PEOPLE[k];}); },\n    title:function(o){ return o.name; },\n    meta:function(o){ return o.role; },\n    sub:function(o){ return o.role+\" · \"+o.bu; },\n    explain:\"A Person is an accountability anchor. Every owner, sponsor, risk owner, evidence owner, incident reporter and decision-taker resolves to one — which is why the inverse edges matter: a board member who owns nothing still takes decisions.\",\n    badges:function(o){ return o.seat!==\"—\"?'<span class=\"pill\">'+esc(o.seat)+'<\u002Fspan>':\"\"; },\n    facts:[\n      [\"Role\",function(o){ return esc(o.role); }],\n      [\"Business unit\",function(o){ return esc(o.bu); }],\n      [\"Board seat\",function(o){ return o.seat===\"—\"?\"Not a board seat\":esc(o.seat); }],\n      [\"Email\",function(o){ return '<a href=\"mailto:'+esc(o.email)+'\" style=\"color:var(--val)\">'+esc(o.email)+'<\u002Fa>'; }]\n    ],\n    edges:[\n      {via:\"owns\", inv:\"is owned by\", to:\"initiative\", ids:function(o){ return INITIATIVES.filter(function(i){return i.owner===o.id;}).map(function(i){return i.id;}); }},\n      {via:\"sponsors\", inv:\"is sponsored by\", to:\"initiative\", ids:function(o){ return INITIATIVES.filter(function(i){return i.sponsor===o.id;}).map(function(i){return i.id;}); }},\n      {via:\"owns the risk\", inv:\"is owned by\", to:\"risk\", ids:function(o){ return RISKS.filter(function(r){return r.owner===o.id;}).map(function(r){return r.id;}); }},\n      {via:\"took\", inv:\"was taken by\", to:\"decision\", ids:function(o){ return DECISIONS.filter(function(d){return d.by===o.id;}).map(function(d){return d.id;}); }},\n      {via:\"attached\", inv:\"is owned by\", to:\"evidence\", ids:function(o){ return EVIDENCE.filter(function(e){return e.owner===o.id;}).map(function(e){return e.id;}); }},\n      {via:\"reported\", inv:\"was reported by\", to:\"incident\", ids:function(o){ return INCIDENTS.filter(function(n){return n.by===o.id;}).map(function(n){return n.id;}); }},\n      {via:\"is accountable for\", inv:\"is owned by\", to:\"control\", ids:function(o){ return CONTROLS.filter(function(c){return c.owner===o.id;}).map(function(c){return c.key;}); }},\n      {via:\"chaired\", inv:\"was chaired by\", to:\"meeting\", ids:function(o){ return MEETINGS.filter(function(m){return m.chair===o.id;}).map(function(m){return m.id;}); }},\n      {via:\"sat at\", inv:\"was attended by\", to: ; }],\n      [\"Risk level\",function(o){ return ragBadge(levelOf(o))+' <span class=\"muted-note\">score '+riskScore(o.likelihood,o.severity)+'/25<\u002Fspan>'; }],\n      [\"Lifecycle stage\",function(o){ return esc(o.lifecycleStage); }],\n      [\"Treatment\",function(o){ return o.treatment?esc(titleCase(o.treatment.strategy))+\" · review every \"+o.treatment.reviewCadenceDays+\" days · \"+esc(pname(o.treatment.owner)):'<span class=\"muted-note\">No treatment recorded<\u002Fspan>'; }],\n      [\"Status\",function(o){ return esc(o.status); }]\n    ],\n    edges:[\n      {via:\"is carried by\", inv:\"carries\", to:\"initiative\", ids:function(o){ return [o.init]; }},\n      {via:\"is treated by\", inv:\"treats\", to:\"control\", ids:function(o){ return o.controlKey?[o.controlKey]:[]; }},\n      {via:\"is owned by\", inv:\"owns the risk\", to:\"person\", ids:function(o){ return [o.owner]; }},\n      {via:\"was decided in\", inv:\"decides on\", to:\"decision\", ids:function(o){ return o.decision?[o.decision]:[]; }},\n      {via:\"surfaced as\", inv:\"traces to\", to:\"incident\", ids:function(o){ return INCIDENTS.filter(function(n){return n.risk===o.id;}).map(function(n){return n.id;}); }},\n      {via:\"is registered under\", inv:\"is registered as\", to:\"techrisk\", ids:function(o){\n        return TECH_RISKS.filter(function(t){ return techIncidents(t).some(function(n){ return n.risk===o.id; }); }).map(function(t){ return t.id; }); }}\n    ],\n    acts:[\"decision\",\"evidence\"]\n  },\n\n  control:{\n    label:\"Control\", plural:\"Controls\", accent:\"gov\",\n    get:function(id){ return byId(CONTROLS,id,\"key\"); },\n    all:function(){ return CONTROLS.slice(); },\n    title:function(o){ return o.key+\" — \"+o.objective; },\n    meta:function(o){ return o.closure; },\n    sub:function(o){ return \"ISO/IEC 42001 Annex A\"; },\n    explain:\"A Control is an Annex A objective. It is what a risk is treated by and what a regulation requires, so it is the join between the obligation and the thing that proves it was met.\",\n    // A control is portfolio-wide, so its way home is every initiative it actually reaches —\n    // through the risks it treats and the evidence captured against it. Not one door: all of them.\n    homes:function(o){\n      var ids={};\n      RISKS.forEach(function(r){ if(r.controlKey===o.key) ids[r.init]=\"s-risks\"; });\n      EVIDENCE.forEach(function(e){ if(e.controlKey===o.key && !ids[e.init]) ids[e.init]=\"s-evidence\"; });\n      var out=Object.keys(ids).map(function(k){ return {init:k, section:ids[k]}; });\n      // A.2 policies and A.3 internal organization genuinely reach no single initiative: they\n      // govern the management system. Saying \"portfolio-wide\" is the truth; inventing a link\n      // to an initiative it does not touch would not be.\n      return out.length?out:[{portfolio:true}];\n    },\n    badges:function(o){ return '<span class=\"pill\" data-tone=\"'+(o.closure===\"implemented\"?\"green\":o.closure===\"in-progress\"?\"amber\":\"red\")+'\">'+esc(titleCase(o.closure))+'<\u002Fspan>'; },\n    facts:[\n      [\"Objective\",function(o){ return esc(o.objective); }],\n      [\"Closure state\",function(o){ return esc(titleCase(o.closure)); }],\n      [\"Accountable\",function(o){ return esc(pname(o.owner)); }],\n      [\"Risks treated\",function(o){ return RISKS.filter(function(r){return r.controlKey===o.key;}).length+\" open\"; }]\n    ],\n    edges:[\n      {via:\"treats\", inv:\"is treated by\", to:\"risk\", ids:function(o){ return RISKS.filter(function(r){return r.controlKey===o.key;}).map(function(r){return r.id;}); }},\n      {via:\"is evidenced by\", inv:\"evidences\", to:\"evidence\", ids:function(o){ return EVIDENCE.filter(function(e){return e.controlKey===o.key;}).map(function(e){return e.id;}); }},\n      {via:\"is required by\", inv:\"requires\", to:\"regulation\", ids:function(o){ return REGS.filter(function(g){return g.requires.indexOf(o.key)!==-1;}).map(function(g){return g.id;}); }},\n      {via:\"is owned by\", inv:\"is accountable for\", to:\"person\", ids:function(o){ return [o.owner]; }},\n      {via:\"assesses\", inv:\"is assessed under\", to:\"supplier\", ids:function(o){ return SUPPLIERS.filter(function(s){return s.control===o.key;}).map(function(s){return s.id;}); }}\n    ],\n    acts:[\"evidence\",\"decision\"]\n  },\n\n  evidence:{\n    label:\"Evidence\", plural:\"Evidence\", accent:\"gov\",\n    get:function(id){ return byId(EVIDENCE,id); },\n    all:function(){ return EVIDENCE.slice(); },\n    title:function(o){ return o.title; },\n    meta:function(o){ return o.kind; },\n    sub:function(o){ return titleCase(o.kind)+\" · \"+initiative(o.init).title; },\n    homes:function(o){ return [{init:o.init, section:\"s-evidence\"}]; },\n    explain:\"An Evidence artefact is what makes a control claim checkable. It is owned by a Person, attached to a Control, and carries the dates that decide when it goes stale.\",\n    badges:function(o){ return '<span class=\"pill\">'+esc(titleCase(o.kind))+'<\u002Fspan>'+(o.controlKey?'<span class=\"pill\">'+esc(o.controlKey)+'<\u002Fspan>':\"\"); },\n    facts:[\n      [\"Artefact kind\",function(o){ return esc(titleCase(o.kind)); }],\n      [\"What it says\",function(o){ return esc(o.content); }],\n      [\"Annex A control\",function(o){ return esc(o.controlKey||\"—\"); }],\n      [\"Owner\",function(o){ return esc(pname(o.owner)); }],\n      [\"Captured\",function(o){ return esc(o.capturedAt); }],\n      [\"Re-assess by\",function(o){ return o.dueAt?esc(o.dueAt):'<span class=\"muted-note\">No re-assessment date set<\u002Fspan>'; }]\n    ],\n    edges:[\n      {via:\"evidences\", inv:\"is evidenced by\", to:\"control\", ids:function(o){ return o.controlKey?[o.controlKey]:[]; }},\n      {via:\"is owned by\", inv:\"attached\", to:\"person\", ids:function(o){ return [o.owner]; }},\n      {via:\"was captured for\", inv:\"holds\", to:\"initiative\", ids:function(o){ return [o.init]; }}\n
