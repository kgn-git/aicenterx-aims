nded to the log. <b>Name the session<\u002Fb> — without one this is an assertion, not a minute.\";\n      var q=boardQuorum(), quorate=m.present.length>=q;\n      return \"Minuted at <b>\"+esc(m.title)+\"<\u002Fb> (\"+esc(m.date)+\"), which was \"+\n        (quorate?\"<b>quorate<\u002Fb> at \":\"<b>not quorate<\u002Fb> at \")+m.present.length+\"/\"+BOARD_SEATS.length+\" seats\"+\n        (quorate?\".\":\" — a decision taken without quorum is challengeable.\");\n    }\n  },\n  impact:{\n    title:\"Add an impact entry\", writes:\"ImpactEntry\", source:\"aiia.ts\",\n    intro:\"An impact entry uses the same harm taxonomy and the same likelihood/severity scales as the risk register, so the two can be compared rather than argued about.\",\n    fields:[\n      {k:\"harm\",l:\"Harm category\",t:\"select\",req:true,opts:harmOpts},\n      {k:\"affected\",l:\"Who is affected\",t:\"select\",req:true,opts:function(){return plain(AFFECTED_GROUPS);},half:true},\n      {k:\"likelihood\",l:\"Likelihood\",t:\"select\",req:true,opts:function(){return plain(LIKELIHOODS);},half:true},\n      {k:\"magnitude\",l:\"Magnitude\",t:\"select\",req:true,opts:function(){return plain(SEVERITIES);},half:true},\n      {k:\"description\",l:\"The impact, concretely\",t:\"textarea\",req:true,ph:\"What happens to a person, said plainly.\"}\n    ],\n    derive:function(v){ if(!v.likelihood||!v.magnitude) return \"Pick a likelihood and a magnitude.\";\n      return \"Comparable to a risk at level <b>\"+riskLevel(v.likelihood,v.magnitude)+\"<\u002Fb>.\"; }\n  },\n  model:{\n    title:\"Register an AI model\", writes:\"Model + SystemCard\", source:\"algorithm-taxonomy.ts, reference-stack.ts\",\n    intro:\"A model cannot be registered without the start of its system card. A model nobody can read cannot be handed to a reviewer, a regulator, or the next team.\",\n    fields:[\n      {k:\"name\",l:\"Model name\",t:\"text\",req:true,ph:\"What the team calls it.\"},\n      {k:\"version\",l:\"Version\",t:\"text\",req:true,half:true},\n      {k:\"algorithm\",l:\"Algorithm class\",t:\"select\",req:true,opts:function(){ return ALGORITHM_CLASSES.map(function(c){ return [c,c]; }); },half:true,\n       help:\"The taxonomy the portfolio is classified on — 13 classes, the last of which needs review.\"},\n      {k:\"hosting\",l:\"Hosting / sourcing\",t:\"select\",req:true,opts:function(){return plain(SOURCING_MODES);},half:true},\n      {k:\"conformance\",l:\"Reference stack\",t:\"select\",req:true,opts:function(){return plain(REFERENCE_CONFORMANCE);},half:true,\n       help:\"Deviating is a recorded choice, not a defect — it is how the platform team learns about it.\"},\n      {k:\"initiativeId\",l:\"Serves which initiative\",t:\"select\",req:true,opts:initiativeOpts},\n      {k:\"owner\",l:\"Model owner\",t:\"select\",req:true,opts:peopleOpts},\n      {group:\"System card — required\"},\n      {k:\"intendedUse\",l:\"Intended use\",t:\"textarea\",req:true,ph:\"What it is for, and what decision it supports rather than makes.\"},\n      {k:\"outOfScope\",l:\"Out-of-scope use\",t:\"textarea\",req:true,ph:\"The uses this model must not be put to.\"},\n      {k:\"oversight\",l:\"Human oversight\",t:\"textarea\",req:true,ph:\"Who checks it, and at what point.\"},\n      {k:\"trainingData\",l:\"Training data and provenance\",t:\"textarea\"},\n      {k:\"evaluation\",l:\"Evaluation and metrics\",t:\"textarea\"},\n      {k:\"limitations\",l:\"Known limitations\",t:\"textarea\"}\n    ],\n    derive:function(v){\n      var done=CARD_SECTIONS.filter(function(s){ return String(v[s.f]||\"\").trim()!==\"\"; }).length;\n      return \"System card <b>\"+done+\"/6<\u002Fb> sections answered.\"+\n        (v.conformance===\"deviating\"?\" Deviating from the reference stack — the platform team is notified.\":\"\");\n    }\n  },\n  change:{\n    title:\"Update the change programme\", writes:\"Adkar + change budget\", source:\"adkar.ts, change-load-profile.ts\",\n    intro:\"Five scores, 0–100. Anything below 40 is weak, and the weakest is the one to work on next — the band derived from it is the STATE, read separately from the plan.\",\n    fields:[\n      {k:\"ambition\",l:\"Ambition (the plan)\",t:\"select\",req:true,opts:function(){ return AMBITIONS.map(function(a){ return [a,a]; }); },\n       help:\"Deploy, Reshape or Invent — this sets the expected change load of the plan, independently of readiness.\"},\n      {k:\"awareness\",l:\"Awareness\",t:\"number\",req:true,half:true,ph:\"0–100\"},\n      {k:\"desire\",l:\"Desire\",t:\"number\",req:true,half:true,ph:\"0–100\"},\n      {k:\"knowledge\",l:\"Knowledge\",t:\"number\",req:true,half:true,ph:\"0–100\"},\n      {k:\"ability\",l:\"Ability\",t:\"number\",req:true,half:true,ph:\"0–100\"},\n      {k:\"reinforcement\",l:\"Reinforcement\",t:\"number\",req:true,half:true,ph:\"0–100\"},\n      {k:\"owner\",l:\"Change led by\",t:\"select\",req:true,opts:peopleOpts,half:true},\n      {k:\"intervention\",l:\"Next intervention\",t:\"text\",ph:\"One concrete thing, aimed at the limiting state.\"}\n    ],\n    derive:function(v){\n      var a={}; var ok=true;\n      ADKAR_STATES.forEach(function(s){ var n=Number(v[s]); if(!isFinite(n)) ok=false; a[s]=isFinite(n)?n:0; });\n      if(!ok) return \"Score all five states to see the readiness band.\";\n      var as=assessAdkar(a), load=adkarLoadBand(a);\n      return \"Limiting state <b>\"+titleCase(as.limitingState)+\"<\u002Fb> at \"+as.limitingScore+\n        (as.atRisk?\" — <b>adoption risk<\u002Fb>, \"+as.weakStates.length+\" state(s) below \"+ADKAR_WEAKNESS_THRESHOLD:\" — no weak state\")+\n        \". State load <b>\"+load+\"<\u002Fb>\"+(v.ambition?\", plan load <b>\"+AMBITION_LOAD[v.ambition]+\"<\u002Fb> — kept separate, never fused.\":\".\");\n    },\n    apply:function(v,ctx){\n      if(!ctx||!CHANGE[ctx.id]) return;\n      var ch=CHANGE[ctx.id];\n      ADKAR_STATES.forEach(function(s){ var n=Number(v[s]); if(isFinite(n)) ch.adkar[s]=Math.max(0,Math.min(100,n)); });\n      if(v.ambition) ch.ambition=v.ambition;\n      if(v.owner) ch.owner=v.owner;\n      if(v.intervention&&String(v.intervention).trim()) ch.interventions.push(String(v.intervention).trim());\n    }\n  },\n  movewave:{\n    title:\"Move an initiative to another wave\", writes:\"wavePin\", source:\"wave-sequencing.ts\",\n    intro:\"Moving an initiative moves its cost, its change load and the department it lands on with it — every number on both waves is derived, so nothing has to be restated.\",\n    fields:[\n      {k:\"initiativeId\",l:\"Initiative\",t:\"select\",req:true,opts:initiativeOpts},\n      {k:\"wave\",l:\"Into which wave\",t:\"select\",req:true,opts:function(){ return WAVES.map(function(w){ return [String(w.n),\"Wave \"+w.n+\" — \"+w.name+\" (\"+w.start+\" → \"+w.end+\")\"]; }); }}\n    ],\n    derive:function(v){\n      if(!v.initiativeId||!v.wave) return \"Pick an initiative and a destination wave.\";\n      var n=Number(v.wave), from=waveOf(v.initiativeId);\n      if(from&&from.n===n) return \"Already in wave \"+n+\" — nothing would move.\";\n      var ch=changeOf(v.initiativeId), sev=ch?Math.max(changeSeverity(ch),1):1;\n      var b=budgetOf(v.initiativeId);\n      return \"Wave \"+n+\" would go to load <b>\"+(waveLoad(n)+sev)+\"/\"+DEFAULT_WAVE_CAPACITY+\"<\u002Fb>\"+\n        (waveLoad(n)+sev>DEFAULT_WAVE_CAPACITY?\" — <b>over its absorbable capacity<\u002Fb>\":\"\")+\n        (b?\", and carry \"+money(waveCost(n)+b.total)+\".\":\".\");\n    },\n    apply:function(v){\n      var n=Number(v.wave);\n      if(v.initiativeId && byId(WAVES,n,\"n\")) WAVE_PIN[v.initiativeId]=n;\n    }\n  },\n  canvas:{\n    title:\"Define with the AI Canvas\", writes:\"AICanvas\", source:\"canvas.ts, canvas-blocks.ts\",\n    intro:\"The seven canvas fields are the high-level definition of an initiative. The prompts are verbatim from the AI Canvas reference; validateCanvas calls a canvas complete only when every one is answered.\",\n    fields:CANVAS_BLOCKS.map(function(b,ix){\n      return {k:b.f,l:b.l,t:\"textarea\",req:ix===0,ph:b.p,help:ix===0?\"\":b.p};\n    }),\n    derive:function(v){\n      var done=CANVAS_BLOCKS.filter(function(b){ return String(v[b.f]||\"\").trim()!==\"\"; }).length;\n      return done===7 ? \"All seven blocks answered — <b>the canvas is complete<\u002Fb>, and the initiative is defined rather than merely named.\"\n                      : \"<b>\"+done+\" of 7<\u002Fb> blocks answered. An initiative with an incomplete canvas has been named, not defined.\";\n    }\n  },\n  initiative:{\n    title:\"Define an initiative\", writes:\"InitiativeInput + AICanvas + ClassifierSignals\", source:\"initiative.ts, canvas.ts, classify.ts\",\n    intro:\"Identity, then the high-level definition, then the classifier signals. The AI Canvas is not paperwork after the fact — it is what the initiative IS, captured at the point it enters the portfolio.\",\n    fields:[\n      {k:\"title\",l:\"Title\",t:\"text\",req:true,ph:\"What it is called by the people who asked for it.\"},\n      {k:\"businessUnit\",l:\"Business unit\",t:\"text\",req:true,half:true},\n      {k:\"stage\",l:\"Stage\",t:\"select\",req:true,opts:function(){return plain(STAGES);},half:true},\n      {k:\"owner\",l:\"Owner (accountable)\",t:\"select\",req:true,opts:peopleOpts,half:true},\n      {k:\"sponsor\",l:\"Sponsor\",t:\"select\",req:true,opts:peopleOpts,half:true},\n      {k:\"sourcing\",l:\"Sourcing mode\",t:\"select\",opts:function(){return plain(SOURCING_MODES);}},\n      {group:\"High-level definition — the AI Canvas\"}\n    ].concat(CANVAS_BLOCKS.map(function(b,ix){\n      return {k:b.f,l:b.l,t:\"textarea\",req:ix===0,ph:b.p,help:b.p};\n    })).concat([\n      {group:\"Classifier signals\"},\n      {k:\"personalData\",l:\"Processes personal data\",t:\"check\"},\n      {k:\"highSensitivity\",l:\"Includes special-category or high-sensitivity data\",t:\"check\"},\n      {k:\"annexIIIHighRisk\",l:\"Falls in an Annex III high-risk area\",t:\"check\"},\n      {k:\"prohibitedPractice\",l:\"Involves a prohibited practice (Art. 5)\",t:\"check\"},\n      {k:\"solelyAutomated\",l:\"Decides solely automatically, with legal effect\",t:\"check\"},\n      {k:\"generativeOrLLM\",l:\"Generative or LLM-based\",t:\"check\"},\n      {k:\"needsReview\",l:\"Classification is uncertain — needs review\",t:\"check\"}\n    ]),\n    derive:function(v){\n      var t=tierFrom(v);\n      var done=CANVAS_BLOCKS.filter(function(b){ return String(v[b.f]||\"\").trim()!==\"\"; }).length;\n      return \"Classified <b>\"+t+\"<\u002Fb>\"+(t===\"Unacceptable\"?\" — hard-blocked at the Deploy gate.\"\n        :t===\"High\"?\" — an impact assessment and Annex III obligations apply.\"\n        :t===\"Needs review\"?\" — held for a human classification decision.\":\".\")+\n        \" Canvas <b>\"+done+\"/7<\u002Fb> blocks answered.\";\n    }\n  },\n  person:{\n    title:\"Add a person\", writes:\"PersonInput\", source:\"person.ts\",\n    intro:\"Name and role are required because every accountability edge in the graph resolves to a person; an unnamed owner is an unowned thing.\",\n    fields:[\n      {k:\"name\",l:\"Name\",t:\"text\",req:true},\n      {k:\"role\",l:\"Role\",t:\"text\",req:true,ph:\"As it appears in the governance record.\"},\n      {k:\"businessUnit\",l:\"Business unit\",t:\"text\",half:true},\n      {k:\"email\",l:\"Email\",t:\"text\",half:true},\n      {k:\"phone\",l:\"Phone\",t:\"text\",half:true}\n    ],\n    derive:function(){ return \"Becomes selectable as an owner, sponsor, risk owner and decision-taker.\"; }\n  }\n};\n\n/* ===================== MODAL: the drill and the acts =====================\n   A fragment has no route, so opening one must not cost you the page you were reading.\n   The stack carries the walk; the trail at the head gives every step back. */\nvar ui = { stack:[], lastTrigger:null, dirty:false };\nvar maskEl=document.getElementById(\"mask\"), modalEl=document.getElementById(\"modal\");\n\nfunction openObject(type,id,trigger){\n  if(!ONTOLOGY[type]||!ONTOLOGY[type].get(id)) return;\n  // Only the control that opened the FIRST modal is the way back: everything above it lives\n  // inside the dialog and stops existing the moment the stack closes.\n  if(trigger && ui.stack.length===0) ui.lastTrigger=trigger;\n  ui.stack.push({mode:\"object\",type:type,id:id});\n  paintModal();\n}\nfunction openForm(formId,ctx,trigger){\n  if(!FORMS[formId]) return;\n  if(trigger && ui.stack.length===0) ui.lastTrigger=trigger;\n  ui.stack.push({mode:\"form\",form:formId,ctx:ctx||null,values:seedValues(formId,ctx),saved:false});\n  paintModal();\n}\nfunction seedValues(formId,ctx){\n  var v={};\n  if(!ctx) return v;\n  if(formId===\"risk\"&&ctx.type===\"initiative\") v.init=ctx.id;\n  if(formId===\"incident\"&&ctx.type===\"initiative\") v.initiativeId=ctx.id;\n  if(formId===\"evidence\"&&ctx.type===\"initiative\") v.initiativeId=ctx.id;\n  if(formId===\"evidence\"&&ctx.type===\"control\") v.controlKey=ctx.id;\n  if(formId===\"decision\"&&(ctx.type===\"risk\"||ctx.type===\"control\")) v.subject=ctx.id;\n  if(formId===\"decision\"&&ctx.type===\"impact\") v.subject=\"aiia\";\n  if(formId===\"decision\"&&ctx.type===\"meeting\") v.meeting=ctx.id;\n  if(formId===\"decision\"&&ctx.type===\"initiative\"){ var nx=MEETINGS.filter(function(m){return m.status===\"scheduled\";})[0]; if(nx) v.meeting=nx.id; }\n  if(formId===\"canvas\"&&ctx.type===\"initiative\"){ var cv=canvasOf(ctx.id); if(cv) CANVAS_BLOCKS.forEach(function(b){ v[b.f]=cv[b.f]||\"\"; }); }\n  if(formId===\"change\"&&(ctx.type===\"initiative\"||ctx.type===\"change\")){\n    var ch=changeOf(ctx.id);\n    if(ch){ ADKAR_STATES.forEach(function(st){ v[st]=ch.adkar[st]; }); v.ambition=ch.ambition; v.owner=ch.owner; }\n  }\n  if(formId===\"model\"&&ctx.type===\"initiative\") v.initiativeId=ctx.id;\n  if(formId===\"movewave\"&&ctx.type===\"initiative\"){ v.initiativeId=ctx.id; var w0=waveOf(ctx.id); if(w0) v.wave=String(w0.n); }\n  if(formId===\"movewave\"&&ctx.type===\"wave\") v.wave=ctx.id;\n  return v;\n}\nfunction backTo(n){ ui.stack=ui.stack.slice(0,n+1); paintModal(); }\nfunction closeModal(){\n  ui.stack=[]; maskEl.hidden=true; document.body.style.overflow=\"\";\n  if(ui.dirty){ ui.dirty=false; render(); }\n  if(ui.lastTrigger&&document.contains(ui.lastTrigger)) ui.lastTrigger.focus();\n  ui.lastTrigger=null;\n}\nfunction trailHTML(){\n  if(ui.stack.length<2) return \"\";\n  var parts=ui.stack.map(function(s,idx){\n    var label = s.mode===\"object\" ? ONTOLOGY[s.type].label : FORMS[s.form].title;\n    if(idx===ui.stack.length-1) return '<span>'+esc(label)+'<\u002Fspan>';\n    return '<button type=\"button\" data-back=\"'+idx+'\">'+esc(label)+'<\u002Fbutton>';\n  });\n  return '<div class=\"m-trail\">'+parts.join('<span class=\"sep\">›<\u002Fspan>')+'<\u002Fdiv>';\n}\nfunction paintModal(){\n  if(!ui.stack.length) return closeModal();\n  var top=ui.stack[ui.stack.length-1];\n  modalEl.innerHTML = top.mode===\"object\" ? objectHTML(top) : formHTML(top);\n  // A diagram needs room: the editor and its preview sit side by side at desktop widths.\n  modalEl.classList.toggle(\"modal-wide\", top.mode===\"object\" && top.type===\"diagram\");\n  maskEl.hidden=false; document.body.style.overflow=\"hidden\";\n  var first=modalEl.querySelector(\"[data-autofocus]\")||modalEl.querySelector(\"button,a[href],input,select,textarea\");\n  if(first) first.focus();\n  maskEl.scrollTop=0;\n}\n\nfunction objectHTML(entry){\n  var T=ONTOLOGY[entry.type], o=T.get(entry.id);\n  var rel=neighbours(entry.type,entry.id);\n  var homes=homesOf(entry.type,o);\n  var door=T.record?{route:T.route(entry.id),section:null}\n                   :(homes.length===1?{route:\"#/initiative/\"+homes[0].init,section:homes[0].section}:null);\n  return ''+\n  '<div class=\"m-head\">'+trailHTML()+\n    '<div class=\"m-type\">'+esc(T.label)+'<\u002Fdiv>'+\n    '<h2 class=\"m-title\" id=\"modalTitle\">'+esc(T.title(o))+'<\u002Fh2>'+\n    '<div class=\"m-sub\">'+esc(T.sub(o))+'<\u002Fdiv>'+\n    (T.badges&&T.badges(o)?'<div class=\"m-badges\">'+T.badges(o)+'<\u002Fdiv>':\"\")+\n    (homes.length?'<div class=\"m-home\"><span class=\"m-home-lbl\">Part of<\u002Fspan>'+\n      homes.map(function(h){\n        return h.portfolio\n          ? '<a class=\"m-home-link\" data-home data-home-scope=\"portfolio\" href=\"#/portfolio\">Portfolio-wide — no single initiative<\u002Fa>'\n          : '<a class=\"m-home-link\" data-home href=\"#/initiative/'+esc(h.init)+'#'+esc(h.section)+'\">'+esc(initiative(h.init).title)+'<\u002Fa>';\n      }).join(\"\")+'<\u002Fdiv>':\"\")+\n  '<\u002Fdiv>'+\n  '<div class=\"m-body\">'+\n    // A type with its own body (the diagram editor) replaces the fact list, but never the\n    // relations: every object, however specialised its view, still walks the same graph.\n    (T.body ? T.body(o,entry)\n      : '<div class=\"m-sec\">Detail<\u002Fdiv><dl class=\"m-facts\">'+\n        T.facts.map(function(f){ return fact(f[0],f[1](o)); }).join(\"\")+'<\u002Fdl>')+\n    '<div class=\"m-sec\">Related — follow an edge<\u002Fdiv>'+\n    (rel.length?'<div class=\"m-rel\">'+rel.map(function(g){\n      return '<div class=\"m-rel-group\"><div class=\"m-rel-edge\">'+esc(g.via)+'<\u002Fdiv><div class=\"m-rel-items\">'+\n        g.items.map(function(it){ return '<button type=\"button\" data-rel=\"'+esc(it.type)+':'+esc(it.id)+'\">'+esc(it.label)+\n          '<span class=\"arrow\">→ '+esc(ONTOLOGY[it.type].label)+'<\u002Fspan><\u002Fbutton>'; }).join(\"\")+\n      '<\u002Fdiv><\u002Fdiv>'; }).join(\"\")+'<\u002Fdiv>' : '<p class=\"m-note\">Nothing related is recorded yet.<\u002Fp>')+\n  '<\u002Fdiv>'+\n  '<div class=\"m-foot\">'+\n    '<div class=\"m-foot-l\">'+\n      (T.acts||[]).map(function(a){ return '<button class=\"btn-ghost\" type=\"button\" data-act=\"'+a+'\">'+esc(FORMS[a].title)+'<\u002Fbutton>'; }).join(\"\")+\n      '<button class=\"btn-ghost\" type=\"button\" data-ask=\"'+esc(entry.type)+':'+esc(en ere right now.<\u002Fdiv>';\n  return '<div style=\"overflow-x:auto\"><table class=\"reg\"><thead><tr>'+\n    cols.map(function(c){ return \"<th>\"+esc(c.h)+\"<\u002Fth>\"; }).join(\"\")+'<\u002Ftr><\u002Fthead><tbody>'+\n    rows.map(function(r){\n      var o=opener(r);\n      var attr = o.nav ? ' data-nav=\"'+esc(o.nav)+'\"' : ' data-open=\"'+esc(o.open)+'\"';\n      // The row IS the control, so it has to be reachable by keyboard, not only by pointer.\n      return '<tr tabindex=\"0\" role=\"button\"'+attr+'>'+cols.map(function(c){ return \"<td>\"+c.f(r)+\"<\u002Ftd>\"; }).join(\"\")+'<\u002Ftr>';\n    }).join(\"\")+'<\u002Ftbody><\u002Ftable><\u002Fdiv>';\n}\nfunction openInitiative(i){ return {nav:\"#/initiative/\"+i.id}; }\n/** A type's identity is not always `id`: a control is keyed by its Annex A key, and an impact\n *  assessment and a canvas by the initiative they belong to. One resolver, used everywhere. */\nfunction idOf(type,o){\n  if(type===\"control\") return o.key;\n  if(type===\"impact\"||type===\"canvas\"||type===\"change\"||type===\"diagram\") return o.init;\n  if(type===\"systemcard\") return o.model;\n  if(type===\"wave\") return String(o.n);\n  return o.id;\n}\nfunction openAs(type){ return function(o){ return {open:type+\":\"+idOf(type,o)}; }; }\nfunction rowName(i){ return '<span class=\"rowname\">'+esc(i.title)+'<\u002Fspan>'; }\nfunction drillCell(label){ return '<button class=\"drill\" type=\"button\" tabindex=\"-1\">'+esc(label)+'<\u002Fbutton>'; }\n\n/* ===================== a small Mermaid flowchart renderer =====================\n   Supports the subset the architecture diagrams actually use: `flowchart`/`graph` LR or TD,\n   node shapes [] ([]) [()] {{}} (()), the --> -.-> ==> edges with optional |labels|, and\n   subgraph ... end. Ranks by longest path (bounded, so a cycle cannot spin), lays out in\n   columns, and draws. No CDN: the file has to open from file:// with no network. */\nvar MMD_SHAPES = [[\"[(\",\")]\",\"cyl\"],[\"([\",\"])\",\"stadium\"],[\"{{\",\"}}\",\"hex\"],[\"((\",\"))\",\"circle\"],\n                  [\"[\",\"]\",\"rect\"],[\"(\",\")\",\"round\"],[\"{\",\"}\",\"diamond\"]];\nfunction parseMermaid(src){\n  var lines=String(src||\"\").split(\"\\n\").map(function(l){ return l.trim(); }).filter(Boolean);\n  var dir=\"LR\", nodes={}, order=[], edges=[], subs=[], cur=null, classLines=[];\n  function reg(tok){\n    tok=String(tok).trim(); if(!tok) return null;\n    var cls=null, cm=tok.match(/:::([A-Za-z0-9_-]+)\\s*$/);\n    if(cm){ cls=cm[1]; tok=tok.slice(0,cm.index).trim(); }\n    var m=tok.match(/^([A-Za-z0-9_.-]+)\\s*([\\s\\S]*)$/); if(!m) return null;\n    var id=m[1], rest=m[2].trim(), shape=\"rect\", label=id;\n    if(rest){\n      for(var i=0;i<MMD_SHAPES.length;i++){\n        var o=MMD_SHAPES[i][0], c=MMD_SHAPES[i][1];\n        if(rest.indexOf(o)===0 && rest.slice(-c.length)===c){ label=rest.slice(o.length, rest.length-c.length); shape=MMD_SHAPES[i][2]; break; }\n      }\n    }\n    label=label.replace(/^\"|\"$/g,\"\");\n    if(!nodes[id]){ nodes[id]={id:id,label:label,shape:shape,sub:cur,classes:[]}; order.push(id); }\n    if(cls && nodes[id].classes.indexOf(cls)===-1) nodes[id].classes.push(cls);\n    else { if(rest){ nodes[id].label=label; nodes[id].shape=shape; } if(cur&&!nodes[id].sub) nodes[id].sub=cur; }\n    if(cur){ var g=byId(subs,cur,\"name\"); if(g && g.members.indexOf(id)===-1) g.members.push(id); }\n    return id;\n  }\n  lines.forEach(function(line){\n    var h=line.match(/^(?:flowchart|graph)\\s+(LR|TD|TB|RL)\\b/i);\n    if(h){ dir=h[1].toUpperCase(); return; }\n    var sg=line.match(/^subgraph\\s+(.+)$/i);\n    if(sg){ cur=sg[1].replace(/^\"|\"$/g,\"\").trim(); subs.push({name:cur,members:[]}); return; }\n    if(/^end$/i.test(line)){ cur=null; return; }\n    if(/^%%/.test(line) || /^classDef\\s/i.test(line)) return;\n    var cl=line.match(/^class\\s+([A-Za-z0-9_.,\\s-]+?)\\s+([A-Za-z0-9_-]+)$/);\n    if(cl){ classLines.push({ids:cl[1].split(\",\").map(fu t.match(/[\\])}]/g)||[]).length;\n    if(opens!==closes){ errors.push(\"Line \"+l.n+\": unbalanced brackets — a node label is not closed.\"); return; }\n    var hasArrow=/(-->|-\\.->|==>|---)/.test(t);\n    var isNode=/^[A-Za-z0-9_.-]+(\\s*(\\[\\(.*\\)\\]|\\(\\[.*\\]\\)|\\{\\{.*\\}\\}|\\(\\(.*\\)\\)|\\[.*\\]|\\(.*\\)|\\{.*\\}))?(:::[A-Za-z0-9_-]+)?$/.test(t);\n    if(!hasArrow && !isNode) errors.push(\"Line \"+l.n+\": not a node or an edge this renderer understands.\");\n    if(hasArrow && /(-->|-\\.->|==>|---)\\s*$/.test(t)) errors.push(\"Line \"+l.n+\": an arrow with nothing on the other end.\");\n  });\n  if(depth>0) errors.push(\"A subgraph is opened and never closed with “end”.\");\n  if(!errors.length && !parseMermaid(src).order.length) errors.push(\"No nodes found.\");\n  return {ok:errors.length===0, errors:errors.slice(0,4)};\n}\nfunction mmdWrap(text,max){\n  var words=String(text).split(/\\s+/), lines=[], line=\"\";\n  words.forEach(function(w){\n    if(!line) line=w;\n    else if((line+\" \"+w).length<=max) line+=\" \"+w;\n    else { lines.push(line); line=w; }\n  });\n  if(line) lines.push(line);\n  return lines.slice(0,3);\n}\nfunction mmdShapePath(n){\n  var x=n.x,y=n.y,w=n.w,h=n.h;\n  if(n.shape===\"hex\"){ var c=12;\n    return '<path d=\"M '+(x+c)+' '+y+' L '+(x+w-c)+' '+y+' L '+(x+w)+' '+(y+h/2)+' L '+(x+w-c)+' '+(y+h)+' L '+(x+c)+' '+(y+h)+' L '+x+' '+(y+h/2)+' Z\" class=\"mmd-shape\"/>'; }\n  if(n.shape===\"cyl\"){ var r=6;\n    return '<path d=\"M '+x+' '+(y+r)+' A '+(w/2)+' '+r+' 0 0 1 '+(x+w)+' '+(y+r)+' L '+(x+w)+' '+(y+h-r)+\n      ' A '+(w/2)+' '+r+' 0 0 1 '+x+' '+(y+h-r)+' Z\" class=\"mmd-shape\"/>'+\n      '<path d=\"M '+x+' '+(y+r)+' A '+(w/2)+' '+r+' 0 0 0 '+(x+w)+' '+(y+r)+'\" class=\"mmd-shape-top\"/>'; }\n  var rx=n.shape===\"stadium\"||n.shape===\"circle\"||n.shape===\"round\"?h/2:4;\n  return '<rect x=\"'+x+'\" y=\"'+y+'\" width=\"'+w+'\" height=\"'+h+'\" rx=\"'+rx+'\" class=\"mmd-shape\"/>';\n}\nfunction renderMermaid(src){\n  var g=parseMermaid(src);\n  if(!g.order.length) return '<div class=\"empty\">No diagram recorded.<\u002Fdiv>';\n  var vertical=g.dir===\"TD\"||g.dir===\"TB\";\n  var rank={}; g.order.forEach(function(id){ rank[id]=0; });\n  for(var pass=0; pass<g.order.length+2; pass++){\n    var moved=false;\n    g.edges.forEach(function(e){ if(rank[e.b]<rank[e.a]+1){ rank[e.b]=rank[e.a]+1; moved=true; } });\n    if(!moved) break;\n  }\n  g.order.forEach(function(id){\n    var n=g.nodes[id];\n    n.lines=mmdWrap(n.label,20);\n    var longest=n.lines.reduce(function(a,l){ return Math.max(a,l.length); },0);\n    n.w=Math.min(216,Math.max(112,longest*7.1+28));\n    n.h=20+n.lines.length*16;\n  });\n  var cols={}; g.order.forEach(function(id){ (cols[rank[id]]=cols[rank[id]]||[]).push(id); });\n  var keys=Object.keys(cols).map(Number).sort(function(a,b){ return a-b; });\n  var GAPX=vertical?34:96, GAPY=vertical?70:30, PAD=22;\n  var colSize={}, x=PAD, maxCross=0;\n  keys.forEach(function(k){\n    var ids=cols[k];\n    var across=ids.reduce(function(a,id){ return a+(vertical?g.nodes[id].w:g.nodes[id].h); },0)+GAPY*(ids.length-1);\n    colSize[k]={along:ids.reduce(function(a,id){ return Math.max(a,vertical?g.nodes[id].h:g.nodes[id].w); },0),across:across};\n    maxCross=Math.max(maxCross,across);\n  });\n  keys.forEach(function(k){\n    var ids=cols[k], off=PAD+(maxCross-colSize[k].across)/2;\n    ids.forEach(function(id){\n      var n=g.nodes[id];\n      if(vertical){ n.x=off; n.y=x; off+=n.w+GAPY; }\n      else { n.x=x; n.y=off; off+=n.h+GAPY; }\n    });\n    x+=colSize[k].along+GAPX;\n  });\n  var W=vertical?maxCross+PAD*2:x-GAPX+PAD, H=vertical?x-GAPX+PAD:maxCross+PAD*2;\n  var boxes=g.subs.filter(function(s){ return s.members.length; }).map(function(s){\n    var ms=s.members.map(function(id){ return g.nodes[id]; });\n    var x1=Math.min.apply(null,ms.map(function(n){return n.x;}))-14, y1=Math.min.apply(null,ms.map(function(n){return n.y;}))-26;\n    var x2=Math.max.apply(null,ms.map(function(n){return n.x+n.w;}))+14, y2=Math.max.apply(null,ms.map(function(n){return n.y+n.h;}))+14;\n    return '<rect x=\"'+x1+'\" y=\"'+y1+'\" width=\"'+(x2-x1)+'\" height=\"'+(y2-y1)+'\" rx=\"5\" class=\"mmd-sub\"/>'+\n      '<text x=\"'+(x1+9)+'\" y=\"'+(y1+16)+'\" class=\"mmd-sub-label\">'+esc(s.name)+'<\u002Ftext>';\n  }).join(\"\");\n  var lines=g.edges.map(function(e){\n    var a=g.nodes[e.a], b=g.nodes[e.b]; if(!a||!b) return \"\";\n    var x1,y1,x2,y2,d;\n    if(vertical){ x1=a.x+a.w/2; y1=a.y+a.h; x2=b.x+b.w/2; y2=b.y;\n      d=\"M \"+x1+\" \"+y1+\" C \"+x1+\" \"+(y1+26)+\", \"+x2+\" \"+(y2-26)+\", \"+x2+\" \"+y2; }\n    else { x1=a.x+a.w; y1=a.y+a.h/2; x2=b.x; y2=b.y+b.h/2;\n      d=\"M \"+x1+\" \"+y1+\" C \"+(x1+40)+\" \"+y1+\", \"+(x2-40)+\" \"+y2+\", \"+x2+\" \"+y2; }\n    var lbl=e.label?'<text x=\"'+((x1+x2)/2)+'\" y=\"'+((y1+y2)/2-6)+'\" class=\"mmd-edge-label\">'+esc(e.label)+'<\u002Ftext>':\"\";\n    return '<path d=\"'+d+'\" class=\"mmd-edge'+(e.dashed?\" mmd-dashed\":\"\")+'\" marker-end=\"url(#mmdArrow)\"/>'+lbl;\n  }).join(\"\");\n  var shapes=g.order.map(function(id){\n    var n=g.nodes[id];\n    var text=n.lines.map(function(l,ix){\n      return '<tspan x=\"'+(n.x+n.w/2)+'\" dy=\"'+(ix===0?0:16)+'\">'+esc(l)+'<\u002Ftspan>';\n    }).join(\"\");\n    var cls=(n.classes||[]).map(function(c){ return \" mmd-cls-\"+esc(c); }).join(\"\");\n    return '<g class=\"mmd-node'+cls+'\" data-mmd-node=\"'+esc(id)+'\">'+mmdShapePath(n)+\n      '<text x=\"'+(n.x+n.w/2)+'\" y=\"'+(n.y+n.h/2 - (n.lines.length-1)*8 + 5)+'\" class=\"mmd-label\">'+text+'<\u002Ftext><\u002Fg>';\n  }).join(\"\");\n  return '<div class=\"mmd\"><svg viewBox=\"0 0 '+Math.ceil(W)+' '+Math.ceil(H)+'\" role=\"img\" aria-label=\"Architecture diagram\">'+\n    '<defs><marker id=\"mmdArrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">'+\n    '<path d=\"M 0 0 L 10 5 L 0 10 z\" class=\"mmd-arrow\"/><\u002Fmarker><\u002Fdefs>'+\n    boxes+lines+shapes+'<\u002Fsvg><\u002Fdiv>';\n}\n\n/* ---------- the diagram modal: view, edit, validate, undo ---------- */\n/** A starting point for an undrawn diagram, generated from the pipeline the graph already knows:\n *  its sources, the shared assets they feed, the models those carry. Better than a blank box. */\nfunction diagramSkeleton(initId){\n  return pipelineMermaid({nodes:pipelineOf(initId).nodes, edges:pipelineOf(initId).edges, shared:[]})\n    .split(\"\\n\").filter(function(l){ return !/^\\s*class\\s/.test(l); }).join(\"\\n\");\n}\nfunction diagramModalBody(o,entry){\n  var hist=(DIAGRAM_HISTORY[o.init]||[]).length;\n  if(!entry.edit){\n    if(!o.src){\n      return '<div class=\"m-sec\">Diagram<\u002Fdiv>'+\n        '<div class=\"surface\"><div class=\"empty\">No architecture diagram yet for '+esc(initiative(o.init).title)+'.<br>'+\n        '<span class=\"muted-note\">Start from the pipeline the graph already knows — its data sources, the shared assets they feed and the models those carry — then edit it.<\u002Fspan><\u002Fdiv><\u002Fdiv>'+\n        '<div class=\"mmd-toolbar\"><button class=\"btn-primary\" type=\"button\" data-mmd-skeleton data-autofocus>Start from the derived pipeline<\u002Fbutton>'+\n        (hist?'<button class=\"btn-ghost\" type=\"button\" data-mmd-undo>Undo last change ('+hist+')<\u002Fbutton>':\"\")+'<\u002Fdiv>';\n    }\n    return '<div class=\"m-sec\">Diagram<\u002Fdiv>'+renderMermaid(o.src)+\n      '<div class=\"mmd-toolbar\">'+\n        '<button class=\"btn-primary\" type=\"button\" data-mmd-edit data-autofocus>Edit Mermaid<\u002Fbutton>'+\n        '<button class=\"btn-ghost\" type=\"button\" data-mmd-undo'+(hist?\"\":\" disabled\")+'>Undo last change'+(hist?\" (\"+hist+\")\":\"\")+'<\u002Fbutton>'+\n        '<span class=\"m-note\">'+(hist?hist+\" earlier version\"+(hist===1?\"\":\"s\")+\" kept — undo steps back one at a time.\":\"No earlier versions yet.\")+'<\u002Fspan>'+\n      '<\u002Fdiv>'+\n      '<details class=\"mmd-details\"><summary class=\"see-all\" style=\"cursor:pointer\">Mermaid source<\u002Fsummary><pre class=\"mmd-src\">'+esc(o.src)+'<\u002Fpre><\u002Fdetails>';\n  }\n  var v=validateMermaid(entry.draft);\n  return '<div class=\"m-sec\">Edit the Mermaid source<\u002Fdiv>'+\n    '<div class=\"mmd-edit\">'+\n      '<div class=\"mmd-edit-src\">'+\n        '<label class=\"f-lbl\" for=\"mmd-editor\">Source — flowchart LR or TD<\u002Flabel>'+\n        '<textarea id=\"mmd-editor\" class=\"f-ctl\" spellcheck=\"false\" data-autofocus>'+esc(entry.draft)+'<\u002Ftextarea>'+\n        '<div id=\"mmd-status\" class=\"mmd-status\" data-ok=\"'+v.ok+'\" role=\"status\" aria-live=\"polite\">'+mmdStatusText(v)+'<\u002Fdiv>'+\n      '<\u002Fdiv>'+\n      '<div class=\"mmd-edit-preview\"><div class=\"f-lbl\" id=\"mmd-preview-lbl\">'+(v.ok?\"Preview\":\"Preview — showing the last valid version\")+'<\u002Fdiv>'+\n        '<div id=\"mmd-preview\">'+renderMermaid(v.ok?entry.draft:entry.lastValid)+'<\u002Fdiv><\u002Fdiv>'+\n    '<\u002Fdiv>'+\n    '<div class=\"mmd-toolbar\">'+\n      '<button class=\"btn-primary\" type=\"button\" data-mmd-save'+(v.ok?\"\":\" disabled\")+'>Save diagram<\u002Fbutton>'+\n      '<button class=\"btn-ghost\" type=\"button\" data-mmd-lastvalid'+(v.ok?\" hidden\":\"\")+'>Back to last valid version<\u002Fbutton>'+\n      '<button class=\"btn-ghost\" type=\"button\" data-mmd-discard>Discard changes<\u002Fbutton>'+\n      '<span class=\"m-note\">Saving keeps the previous version, so a bad edit is one Undo away.<\u002Fspan>'+\n    '<\u002Fdiv>';\n}\nfunction mmdStatusText(v){\n  return v.ok ? \"Valid — the preview is what will be saved.\"\n    : \"<b>Not valid yet:<\u002Fb><ul>\"+v.errors.map(function(e){ return \"<li>\"+esc(e)+\"<\u002Fli>\"; }).join(\"\")+\"<\u002Ful>\";\n}\n/** Re-validate and re-preview in place, without repainting the modal: repainting would move the\n *  caret out of the textarea on every keystroke. */\nfunction refreshDiagramEditor(entry){\n  var v=validateMermaid(entry.draft);\n  if(v.ok) entry.lastValid=entry.draft;\n  var st=document.getElementById(\"mmd-status\"); if(st){ st.innerHTML=mmdStatusText(v); st.setAttribute(\"data-ok\",String(v.ok)); }\n  var pv=document.getElementById(\"mmd-preview\"); if(pv) pv.innerHTML=renderMermaid(v.ok?entry.draft:entry.lastValid);\n  var lb=document.getElementById(\"mmd-preview-lbl\"); if(lb) lb.textContent=v.ok?\"Preview\":\"Preview — showing the last valid version\";\n  var sv=modalEl.querySelector(\"[data-mmd-save]\"); if(sv) sv.disabled=!v.ok;\n  var lv=modalEl.querySelector(\"[data-mmd-lastvalid]\"); if(lv) lv.hidden=v.ok;\n}\n\n/* ===================== PAGES ===================== */\nfunction signalBand(eyebrow,accent,level,metric,statement,actions,sub){\n  return '<section class=\"signal\"'+(accent?' data-accent=\"'+accent+'\"':\"\")+(level?' data-level=\"'+level+'\"':\"\")+'>'+\n    '<span class=\"signal-eyebrow\">'+esc(eyebrow)+'<\u002Fspan>'+\n    '<div class=\"signal-head\">'+(metric!==null&&metric!==undefined&&metric!==\"\"?'<span class=\"signal-metric\">'+metric+'<\u002Fspan>':\"\")+\n      '<p class=\"signal-statement\">'+statement+'<\u002Fp>'+(actions?'<div class=\"signal-actions\">'+actions+'<\u002Fdiv>':\"\")+'<\u002Fdiv>'+\n    (sub?'<ul class=\"signal-sub\">'+sub.map(function(s){return '<li><b>'+s[1]+'<\u002Fb> '+esc(s[0])+'<\u002Fli>';}).join(\"\")+'<\u002Ful>':\"\")+\n  '<\u002Fsection>';\n}\n\nfunction pageHome(){\n  var needReview=INITIATIVES.filter(function(i){return i.disp===\"Conditions\"||i.disp===\"Blocked\";});\n  var blocked=INITIATIVES.filter(function(i){return i.disp===\"Blocked\";});\n  var highRisks=RISKS.filter(function(r){var l=levelOf(r);return l===\"high\"||l===\"critical\";});\n  return ''+\n  signalBand(\"Command center · good afternoon, Jordan\",\"gov\",null,\"\",\n    \"<strong>\"+needReview.length+\" initiatives<\u002Fstrong> need a governance decision, <strong>\"+blocked.length+\" is blocked<\u002Fstrong> at the gate, and the board meets in <strong>4 days<\u002Fstrong> with 2 items to clear.\",\n    '<a class=\"btn-primary\" data-nav=\"#/register/risk\">Review the open risks<\u002Fa><a class=\"btn-ghost\" data-nav=\"#/ontology\">See how this is wired<\u002Fa>',\n    [[\"initiatives\",INITIATIVES.length],[\"high+ risks\",highRisks.length],[\"open incidents\",INCIDENTS.filter(function(n){return n.status===\"open\";}).length],[\"board seats filled\",\"6/7\"]])+\n  '<div class=\"block\"><div class=\"block-head\"><h2 class=\"block-title\">Needs a decision<\u002Fh2><a class=\"see-all\" data-nav=\"#/portfolio\">See full portfolio →<\u002Fa><\u002Fdiv>'+\n    '<div class=\"surface pad\">'+registerTable(needReview,[\n      {h:\"Initiative\",f:rowName},\n      {h:\"Stage\",f:function(i){return '<span class=\"stage-badge\">'+i.stage+'<\u002Fspan>';}},\n      {h:\"Tier\",f:function(i){return '<span class=\"pill\" data-tone=\"'+tierTone(i.tier)+'\">'+esc(i.tier)+'<\u002Fspan>';}},\n      {h:\"Disposition\",f:function(i){return '<span class=\"pill\" data-tone=\"'+i.dispTone+'\">'+esc(i.disp)+'<\u002Fspan>';}},\n      {h:\"Owner\",f:function(i){return personChip(PEOPLE[i.owner]);}}\n    ],openInitiative)+'<\u002Fdiv><\u002Fdiv>'+\n  '<div class=\"block\"><div class=\"block-head\"><h2 class=\"block-title\">How to move around<\u002Fh2>'+\n    '<span class=\"block-hint\">Three rules, and they hold on every page<\u002Fspan><\u002Fdiv><div class=\"legend\">'+\n    '<div class=\"legend-card\" data-t=\"1\"><span class=\"n\">The rail<\u002Fspan><h4>Navigation, by relationship<\u002Fh4>'+\n      '<p>The right rail carries the jump links and the typed neighbourhood — “this initiative <i>is owned by<\u002Fi>…”. It never holds detail.<\u002Fp><\u002Fdiv>'+\n    '<div class=\"legend-card\" data-t=\"2\"><span class=\"n\">The modal<\u002Fspan><h4>The drill, and the acts<\u002Fh4>'+\n      '<p>Opening a risk, a control or an incident never costs you the page you were reading. Adding one is the same modal, with the fields the domain actually holds.<\u002Fp><\u002Fdiv>'+\n    '<div class=\"legend-card\" data-t=\"3\"><span class=\"n\">The route<\u002Fspan><h4>The record<\u002Fh4>'+\n      '<p>An initiative, a person, a board session and a delivery wave get a URL — they are things you send someone. Everything else is a fragment, and every fragment carries the way back to the initiative it is part of.<\u002Fp><\u002Fdiv>'+\n  '<\u002Fdiv><\u002Fdiv>';\n}\n\n/* ---- the ontology map: the graph, walkable ---- */\n/* Three maps, not one: every type on a single spine is a picture nobody reads. Each map is the\n   neighbourhood of one nav group, and the table below all three is the full declaration. */\nvar OMAPS = [\n  {id:\"governance\", title:\"Governance\", w:900, h:560,\n   note:\"What the board decides, on what evidence, and against which obligation.\",\n   nodes:[{t:\"regulation\",x:100,y:60},{t:\"impact\",x:330,y:60},{t:\"risk\",x:570,y:110},{t:\"control\",x:770,y:160},\n          {t:\"person\",x:100,y:215},{t:\"initiative\",x:330,y:215,hub:true},{t:\"incident\",x:570,y:215},\n          {t:\"evidence\",x:770,y:300},{t:\"decision\",x:570,y:330},{t:\"canvas\",x:150,y:490},{t:\"meeting\",x:620,y:490}],\n   edges:[{a:\"person\",b:\"initiative\",l:\"owns / sponsors\",lx:215,ly:206},\n          {a:\"initiative\",b:\"impact\",l:\"is assessed by\",lx:340,ly:140,anchor:\"start\"},\n          {a:\"initiative\",b:\"regulation\",l:\"is governed by\",lx:210,ly:130},\n          {a:\"initiative\",b:\"risk\",l:\"carries\",lx:452,ly:156},\n          {a:\"initiative\",b:\"incident\",l:\"has suffered\",lx:450,ly:207},\n          {a:\"incident\",b:\"risk\",l:\"traces to\",lx:580,ly:166,anchor:\"start\"},\n          {a:\"risk\",b:\"control\",l:\"is treated by\",lx:670,ly:128},\n          {a:\"control\",b:\"evidence\",l:\"is evidenced by\",lx:762,ly:232,anchor:\"end\"},\n          {path:\"M 770 160 Q 440 8 100 60\",l:\"is required by\",lx:440,ly:26},\n          {path:\"M 570 110 Q 690 220 570 ident<\u002Fh3>'+\n      '<span class=\"block-hint\">Rights-impact incidents are about people and are left out here<\u002Fspan><\u002Fdiv>'+\n    '<div class=\"surface pad\">'+registerTable(techInc,[\n      {h:\"Incident\",f:function(n){ return drillCell(n.summary); }},\n      {h:\"Category\",f:function(n){ return esc(titleCase(n.classification)); }},\n      {h:\"Model\",f:function(n){ var m=byId(MODELS,n.model); return m?esc(m.name):\"—\"; }},\n      {h:\"Raised\",f:function(n){ return esc(n.raisedAt); }},\n      {h:\"Registered risk\",f:function(n){ return n.risk?'<span class=\"pill\" data-tone=\"green\">'+esc(n.risk)+'<\u002Fspan>':'<span class=\"pill\" data-tone=\"red\">None<\u002Fspan>'; }}\n    ], openAs(\"incident\"))+'<\u002Fdiv><\u002Fdiv>';\n}\n\nfunction pageArchitecture(tab){\n  tab=tab||\"diagrams\";\n  var openTech=INCIDENTS.filter(function(n){ return n.status===\"open\" && TECH_RISKS.some(function(t){ return t.classification===n.classification; }); }).length;\n  var gapCount=TECH_RISKS.reduce(function(a,t){ return a+techGaps(t).length; },0);\n  var drawn=Object.keys(DIAGRAMS).length;\n  var tabsHTML='<div class=\"tabs\" role=\"tablist\" aria-label=\"Architecture views\">'+ARCH_TABS.map(function(t){\n    var n=t[0]===\"diagrams\"?drawn+\"/\"+INITIATIVES.length:t[0]===\"pipelines\"?DATASOURCES.length+\" sources\":TECH_RISKS.length;\n    return '<a class=\"tab\" role=\"tab\" data-nav=\"'+t[2]+'\" aria-selected=\"'+(tab===t[0])+'\">'+esc(t[1])+'<span class=\"n\">'+n+'<\u002Fspan><\u002Fa>'; }).join(\"\")+'<\u002Fdiv>';\n  var body;\n  if(tab===\"pipelines\"){\n    body='<p class=\"muted-note\" style=\"margin:0 0 10px\">Pick initiatives to see their data pipelines combined. Where they share a source, an asset or a model, the node is drawn once and marked — that is where a consolidation saves money, and where one failure lands on all of them.<\u002Fp>'+\n      '<div class=\"filters\" style=\"margin-bottom:10px\"><button class=\"btn-ghost\" type=\"button\" d d quotation. */\nvar COP = { thread:[], busy:false, model:\"ok\", pending:null };\nvar COP_SUGGESTIONS = [\"What is high risk, and why?\",\"Which initiative is blocked, and who decided?\",\n  \"What is the sharpest technology risk?\",\"Which pipelines share personal data?\",\"Where is adoption risk worst?\"];\n\nvar KB = [\n  { match:/high.?risk|riskiest|highest risk|what is high/i,\n    answer:\"Two risks band as **critical or high**. The CV screening assistant carries a likely/severe fundamental-rights exposure with no assessment on file, and retail credit scoring carries a possible/major disparate-impact risk that is under active mitigation. Both are treated under control **A.5 — assessing impacts on individuals, groups and society**.\",\n    cites:[[\"risk\",\"r1\"],[\"risk\",\"r2\"],[\"control\",\"A.5\"]],\n    follow:[\"Who decided to hold CV screening?\",\"What evidence supports A.5?\"] },\n  { match:/blocked|hold|gate|who decided/i,\n    answer:\"**CV Screening Assistant** is held at the gate. The decision is on the log: the board chair recorded an **aiia-trigger** on 12 June holding it until a fundamental-rights assessment and an independent bias audit are complete. The draft assessment exists; sign-off is withheld pending the audit.\",\n    cites:[[\"initiative\",\"hiring\"],[\"decision\",\"d1\"],[\"evidence\",\"e5\"]],\n    follow:[\"What risks does it carry?\",\"Who is the owner?\"] },\n  { match:/reuse|shared|sprawl|duplicat|architect/i,\n    answer:\"The **document embedding service** is the most reused asset — three initiatives stand on it, which makes it both the consolidation candidate and the largest blast radius in the portfolio. The customer feature store is second at three.\",\n    cites:[[\"asset\",\"as-emb\"],[\"asset\",\"as-fs\"]],\n    follow:[\"Which initiatives use the embedding service?\",\"What is the fraud model built on?\"] },\n  { match:/supplier|vendor|third.?party|sourcing/i,\n    answer:\"**ForecastCloud AI** sits at a High posture: a high bias band and moderate data-rights terms, with responsibility shared. Its residency clause is unresolved and is logged as an open risk on demand forecasting. Supplier obligations are governed under **A.10**.\",\n    cites:[[\"supplier\",\"sup-fc\"],[\"risk\",\"r6\"],[\"control\",\"A.10\"]],\n    follow:[\"What evidence is on file for that supplier?\",\"Which other suppliers are High?\"] },\n  { match:/technology risk|security|injection|leak|register gap/i,\n    answer:\"**Security is the sharpest technology risk right now**: two open incidents, a prompt injection on the service copilot and the shared embedding index returning titles across business units. The second one matters more than it looks — **it was never written down as a risk**, and it sits on the most reused model in the portfolio, so its blast radius is every initiative that retrieves through it.\",\n    cites:[[\"techrisk\",\"security\"],[\"incident\",\"n8\"],[\"model\",\"md-embed\"]],\n    follow:[\"Which incidents are missing from the risk register?\",\"What else runs on the embedding model?\"] },\n  { match:/pipeline|data source|shared data|dpia|personal data/i,\n    answer:\"Retail credit, fraud triage and churn **share the customer feature store**, which is fed by card transactions, core banking, CRM and clickstream — all personal data. So a DPIA on any one of them is incomplete without the other two: the shared asset carries personal data from sources none of them individually asked for.\",\n    cites:[[\"asset\",\"as-fs\"],[\"datasource\",\"ds-cards\"],[\"datasource\",\"ds-crm\"]],\n    follow:[\"Which initiatives consume the policy corpus?\",\"Which data sources are high sensitivity?\"] },\n  { match:/incident|went wrong|outage|drift/i,\n    answer:\"**Five incidents are open.** Two are drift — the fraud model's weekend false positives and a four-point approval-rate drift on retail credit after the June rate change. Two are security, on the service copilot and the shared embedding index
