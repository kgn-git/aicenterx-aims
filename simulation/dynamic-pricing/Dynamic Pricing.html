<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dynamic Pricing</title>
<meta name="description" content="Dynamic Pricing, a standalone initiative film for the AI Center X prototype: a demand-based pricing proposal followed from the commercial office and meeting room to the intake review and the planned pricing desk, in four beats. It shows the use as proposed; nothing is built.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  DYNAMIC PRICING (simulation/dynamic-pricing/Dynamic Pricing.html) - initiative film for `pricing`, issue #9 phase 2.
  Built from simulation/_template/film-template.html: only the CONFIG block differs (film-local glyph painters, the 12 shots of
  "Dynamic Pricing - Script and Protocols.md" with their exact on-screen text and timings, build() and update()).
  Everything after "END OF CONFIG" is the shared template machinery, unchanged. Not a scene in Village Film C.
  Test: python test/film_controls_test.py "simulation/dynamic-pricing/Dynamic Pricing.html" test/shots/dynamic-pricing
        python test/dynamic-pricing_test.py
-->
<style>
  :root{
    --ink:#17211f; --paper:#f3efe6; --neutral:#e8e6e1;
    --acc:#e8e6e1; --accl:#f3efe6;
    --hf:"Fraunces","Iowan Old Style",Georgia,serif; --bf:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  html,body{margin:0;height:100%;background:#0f1614;color:var(--paper);font-family:var(--bf);overflow:hidden}
  #stage{position:fixed;inset:0;background:#dce3e6}
  #stage canvas{display:block;width:100%;height:100%}
  #ui{position:fixed;inset:0;pointer-events:none}
  #scrim{position:absolute;inset:0;background:radial-gradient(125% 95% at 0% 100%,rgba(15,22,20,.9) 0%,rgba(15,22,20,.62) 32%,rgba(15,22,20,.22) 56%,rgba(15,22,20,0) 74%);transition:opacity .25s}
  /* top corners: the setting (place and moment) on the left, the initiative on the right, each on its own small scrim pill */
  #top{position:absolute;left:max(24px,4vw);right:max(24px,4vw);top:max(18px,2.6vh);display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:clamp(13px,1.15vw,17px);font-weight:500;letter-spacing:.01em;color:rgba(243,239,230,.95);text-shadow:0 1px 4px rgba(0,0,0,.6)}
  #top #scen,#top #sidx{background:rgba(15,22,20,.58);border:1px solid rgba(243,239,230,.12);border-radius:999px;padding:.38em .85em;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);min-width:0}
  #top #scen{display:flex;align-items:center;gap:.6em}
  #top #scen i{flex:0 0 auto;display:inline-block;width:.75em;height:.75em;border-radius:50%;background:var(--acc);box-shadow:0 0 0 2px rgba(15,22,20,.35)}
  #top #sidx{opacity:.95;text-align:right}
  #top #sidx:empty{display:none}
  /* the caption block sits above the playback bar and stops short of the navigation column on the right */
  #panel{box-sizing:border-box;position:absolute;left:max(24px,4vw);bottom:calc(max(12px,1.6vh) + 44px + clamp(12px,2vh,22px));width:min(64vw,900px);max-width:calc(100vw - 2*max(24px,4vw) - clamp(168px,14.5vw,200px) - 24px);padding-left:clamp(14px,1.6vw,24px);border-left:5px solid var(--acc);transition:border-color .25s}
  /* beat row: the big numeral is the BEAT number (1-4); beside it the AI Canvas source line and the four-step indicator with the current beat lit */
  #beat{display:flex;align-items:flex-end;gap:.5em;margin:0 0 clamp(6px,1vh,12px);line-height:1}
  #bnum{font-family:var(--hf);font-weight:600;font-size:clamp(44px,6.4vw,92px);color:var(--acc);line-height:.86;text-shadow:0 2px 10px rgba(0,0,0,.4)}
  #bmeta{display:flex;flex-direction:column;gap:clamp(4px,.7vh,8px);padding-bottom:.06em;min-width:0}
  #blab{font-size:clamp(14px,1.3vw,20px);font-weight:500;line-height:1.2;color:rgba(243,239,230,.9);text-shadow:0 1px 6px rgba(0,0,0,.55)}
  #blab:empty{display:none}
  #steps{display:flex;flex-wrap:wrap;align-items:center;align-self:flex-start;gap:.25em .5em;padding:.3em .75em;border-radius:999px;background:rgba(15,22,20,.66);font-size:clamp(12px,1.1vw,16px);font-weight:500;letter-spacing:.01em;color:rgba(243,239,230,.86);white-space:nowrap}
  #steps span{transition:color .2s}
  #steps span+span:before{content:"\2192";display:inline-block;margin-right:.5em;color:rgba(243,239,230,.5);font-weight:400}
  #steps span.on{color:var(--accl);font-weight:600}
  #cap p{margin:0}
  #head{font-family:var(--hf);font-weight:500;font-size:clamp(26px,3.6vw,56px);line-height:1.12;letter-spacing:-.005em;text-shadow:0 2px 12px rgba(0,0,0,.5);text-wrap:balance}
  #head.long{font-size:clamp(23px,3vw,48px);line-height:1.14}
  #sup{margin-top:clamp(8px,1.2vh,14px)!important;font-size:clamp(16px,1.6vw,24px);font-weight:400;line-height:1.35;color:rgba(243,239,230,.9);text-shadow:0 1px 8px rgba(0,0,0,.55);text-wrap:pretty}
  #note{margin:clamp(6px,.9vh,10px) 0 0;font-size:clamp(13px,1.05vw,15px);color:rgba(243,239,230,.78);text-shadow:0 1px 6px rgba(0,0,0,.6)}
  #note:empty{display:none}
  /* card slides: an infographic block inside the caption - cards in a row, or a roadmap of stages. Revealed by updateHUD as a pure function of t. */
  #info{display:none;margin-top:clamp(12px,2vh,22px)}
  #panel.info{width:min(78vw,1320px)}
  #panel.info:before{content:"";position:absolute;left:-100vw;right:-100vw;top:-48px;bottom:-240px;z-index:-1;pointer-events:none;background:linear-gradient(to bottom,rgba(15,22,20,0) 0,rgba(15,22,20,.6) 52px,rgba(15,22,20,.84) 130px)}
  #panel.info #info{display:block}
  #panel.info #head{font-size:clamp(24px,3vw,48px)}
  #info h3{margin:0;font-family:var(--hf);font-weight:500;font-size:clamp(18px,1.65vw,28px);line-height:1.14;letter-spacing:-.005em;color:var(--paper)}
  #info p{font-size:clamp(14px,1.2vw,19px);line-height:1.38;color:rgba(243,239,230,.93);text-wrap:pretty}
  #info svg{display:block;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  #cards{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:clamp(10px,1.1vw,18px);margin:0;padding:0;list-style:none}
  .card{box-sizing:border-box;padding:clamp(12px,1.15vw,20px);border-radius:14px;background:rgba(15,22,20,.8);border:1px solid rgba(243,239,230,.2);border-top:3px solid rgba(243,239,230,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .card.now{border-color:rgba(243,239,230,.5);border-top-color:var(--paper)}
  .card .ct{display:flex;align-items:center;gap:.7em;margin:0 0 clamp(7px,.9vh,12px)}
  .card .ic{flex:0 0 auto;display:grid;place-items:center;width:clamp(38px,3.1vw,52px);height:clamp(38px,3.1vw,52px);border-radius:12px;background:var(--paper);color:#0f1614}
  .card .ic svg{width:64%;height:64%}
  #foot{margin-top:clamp(9px,1.4vh,16px)!important;font-size:clamp(12.5px,1.05vw,16px)!important;color:rgba(243,239,230,.86)!important;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  /* roadmap: milestones on a line. A firm stage has a filled node and a solid connector; a conditional stage an outlined node and a dashed connector. */
  #road{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));margin:0;padding:clamp(14px,1.3vw,22px) clamp(14px,1.3vw,22px) clamp(12px,1.2vw,20px);list-style:none;border-radius:14px;background:rgba(15,22,20,.8);border:1px solid rgba(243,239,230,.2);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .stage{min-width:0;padding-right:clamp(10px,1.2vw,22px)}
  .stage:last-child{padding-right:0}
  .stage .trk{display:flex;align-items:center;margin:0 calc(-1*clamp(10px,1.2vw,22px)) clamp(8px,1vh,12px) 0}
  .stage:last-child .trk{margin-right:0}
  .stage .node{flex:0 0 auto;box-sizing:border-box;display:grid;place-items:center;width:clamp(38px,3.1vw,52px);height:clamp(38px,3.1vw,52px);border-radius:50%;background:var(--paper);color:#0f1614;border:2px solid var(--paper)}
  .stage.cond .node{background:rgba(15,22,20,.55);color:var(--paper);border-style:dashed}
  .stage .node svg{width:60%;height:60%}
  .stage .ln{flex:1 1 auto;height:0;border-top:3px solid var(--paper);transform:scaleX(var(--r,0));transform-origin:left center}
  .stage .ln.dash{border-top-style:dashed;opacity:.85}
  .stage:last-child .ln{visibility:hidden}
  .stage p{margin-top:.3em!important}
  /* step chips: real buttons - each seeks to the start of its step inside the current beat; a thin line links them */
  #strip{display:none;flex-wrap:wrap;align-items:center;gap:6px 0;margin-top:clamp(10px,1.6vh,18px);font-size:clamp(12px,1.1vw,16px);font-weight:500;pointer-events:auto}
  #strip button{margin:0;min-height:32px;padding:.4em .95em;border-radius:999px;background:rgba(15,22,20,.6);color:rgba(243,239,230,.82);border:1px solid rgba(243,239,230,.3);font:inherit;cursor:pointer;transition:background .2s,color .2s;-webkit-tap-highlight-color:transparent}
  #strip button+button{margin-left:16px;position:relative}
  #strip button+button:before{content:"";position:absolute;right:100%;top:50%;width:16px;height:2px;margin-right:1px;background:rgba(243,239,230,.4);pointer-events:none}
  #strip button:hover{background:rgba(243,239,230,.2);color:var(--paper);border-color:var(--paper)}
  #strip button:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
  #strip button.on{background:var(--acc);color:#0f1614;border-color:var(--acc)}
  /* playback bar: previous scene, play/pause, next scene, scrubber with scene ticks, keyboard hint, time readout, restart */
  #bar{position:absolute;left:max(16px,2.4vw);right:max(16px,2.4vw);bottom:max(12px,1.6vh);height:44px;box-sizing:border-box;display:flex;align-items:center;gap:2px;padding:0 4px;border-radius:22px;background:rgba(15,22,20,.66);border:1px solid rgba(243,239,230,.14);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);pointer-events:auto;transition:opacity .35s}
  #bar button{position:relative;flex:0 0 40px;width:40px;height:40px;margin:0;padding:0;border:0;border-radius:50%;background:transparent;color:var(--paper);display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
  #bar button svg{width:18px;height:18px;fill:currentColor;display:block}
  #bar button:hover{background:rgba(243,239,230,.14)}
  #bar button:focus-visible{outline:2px solid var(--paper);outline-offset:-3px}
  [data-tip]:after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);padding:.35em .7em;border-radius:7px;background:rgba(15,22,20,.94);border:1px solid rgba(243,239,230,.2);color:var(--paper);font:500 12.5px/1.2 var(--bf);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
  [data-tip]:focus-visible:after{opacity:1}
  @media (hover:hover) and (min-width:641px){[data-tip]:hover:after{opacity:1}}
  #bprev[data-tip]:after{left:0;transform:none}
  #brestart[data-tip]:after{left:auto;right:0;transform:none}
  #rail [data-tip]:after{left:auto;right:calc(100% + 8px);bottom:auto;top:50%;transform:translateY(-50%)}
  #bplay{background:var(--paper);color:#0f1614}#bar #bplay:hover{background:#fff}
  #bplay .ic-pause{display:none}#bar.playing #bplay .ic-pause{display:block}#bar.playing #bplay .ic-play{display:none}
  #prog{position:relative;flex:1 1 60px;min-width:60px;height:40px;margin:0 6px;border-radius:8px;cursor:pointer;touch-action:none}
  #prog:focus-visible{outline:2px solid var(--paper);outline-offset:-2px}
  #prog .seg{position:absolute;top:17px;height:6px;border-radius:3px;background:rgba(243,239,230,.22);overflow:hidden}
  #prog .seg b{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--c)}
  #prog .tick{position:absolute;top:16px;width:2px;height:8px;margin-left:-1px;background:rgba(15,22,20,.85);pointer-events:none}
  #prog .knob{position:absolute;top:14px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--paper);box-shadow:0 0 0 2px rgba(15,22,20,.55);pointer-events:none}
  #hint{flex:0 0 auto;padding:0 6px 0 2px;font-size:12px;font-weight:500;color:rgba(243,239,230,.78);white-space:nowrap}
  #hint kbd{display:inline-block;min-width:1.3em;padding:.1em .4em;margin:0 .1em;border:1px solid rgba(243,239,230,.35);border-radius:5px;font:inherit;text-align:center;color:var(--paper)}
  #tm{flex:0 0 auto;padding:0 6px 0 4px;font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:.02em;color:rgba(243,239,230,.9);white-space:nowrap}
  #bar .sep{flex:0 0 1px;width:1px;height:22px;margin:0 3px 0 1px;background:rgba(243,239,230,.22)}
  /* navigation on the right: at rest a thin rail (one numbered dot per beat and a list button); the full list flies out on hover or focus, or is pinned */
  #nav{position:absolute;right:calc(max(10px,1vw) + 50px);top:50%;transform:translateY(-50%);width:clamp(184px,14.5vw,208px);max-height:calc(100vh - 150px);overflow:auto;box-sizing:border-box;padding:6px;border-radius:14px;background:rgba(15,22,20,.8);border:1px solid rgba(243,239,230,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:auto;font-size:13.5px;line-height:1.25;display:none;transition:opacity .2s}
  #nav.open{display:block}
  #nav ol{list-style:none;margin:0;padding:0}
  #nav button{display:flex;align-items:center;gap:.45em;width:100%;min-height:28px;margin:0;padding:3px 8px;border:0;border-radius:8px;background:transparent;color:rgba(243,239,230,.92);font:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
  #nav button:hover{color:#fff;background:rgba(243,239,230,.06);text-decoration:underline;text-decoration-color:rgba(243,239,230,.55);text-underline-offset:3px}
  #nav button:focus-visible{outline:2px solid var(--paper);outline-offset:-2px}
  #nav .sc>button{min-height:32px;margin-top:4px;font-weight:600;color:var(--paper)}
  #nav .sc>button b{font-family:var(--hf);font-weight:600;font-size:1.5em;line-height:1;width:.75em;flex:0 0 auto;color:rgba(243,239,230,.6)}
  #nav .sc.on>button b{color:var(--accl)}
  #nav .beats{margin:0 0 2px calc(8px + 1.2em);border-left:2px solid rgba(243,239,230,.2);padding-left:3px}
  #nav .sc.on .beats{border-color:var(--acc)}
  #nav .beats button{min-height:26px;padding:2px 7px;font-size:.96em}
  #nav button[aria-current],#nav button[aria-current]:hover{color:#0f1614;font-weight:600;background:var(--acc);text-decoration:none;box-shadow:0 0 0 1px rgba(15,22,20,.35)}
  #nav button[aria-current] b{color:#0f1614!important}
  #nav .end>button{min-height:30px}
  #rail{display:flex;position:absolute;right:max(10px,1vw);top:50%;transform:translateY(-50%);flex-direction:column;gap:6px;pointer-events:auto;transition:opacity .35s}
  #rail button{position:relative;width:40px;height:40px;margin:0;padding:0;border:1px solid rgba(243,239,230,.22);border-radius:50%;background:rgba(15,22,20,.72);color:rgba(243,239,230,.92);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);-webkit-tap-highlight-color:transparent}
  #rail button:hover{border-color:var(--paper)}
  #rail .dot{font-family:var(--hf);font-weight:600;font-size:19px;line-height:1}
  #rail .dot.on{background:var(--acc);color:#0f1614;border-color:var(--acc)}
  #rail button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
  #rail button:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
  #rail #navtog[aria-expanded="true"]{background:var(--paper);color:#0f1614}
  @media (hover:hover) and (min-width:901px){
    #nav{display:block;opacity:0}
    #ui.navshow #nav,#nav.open,#nav:focus-within{opacity:1}
  }
  #ui.idle #bar,#ui.idle #rail{opacity:.35}
  #paused{position:absolute;left:50%;top:max(18px,2.6vh);transform:translateX(-50%);display:none;align-items:center;gap:.5em;padding:.38em .9em;border-radius:999px;background:rgba(15,22,20,.72);border:1px solid rgba(243,239,230,.22);font-size:clamp(12px,1.05vw,15px);font-weight:600;letter-spacing:.04em;color:var(--paper)}
  #paused:before{content:"";width:.28em;height:.85em;border-left:.26em solid var(--paper);border-right:.26em solid var(--paper)}
  #ui.paused #paused{display:flex}
  #navback{display:none}
  #fade{position:fixed;inset:0;background:#000;pointer-events:none;opacity:1}
  #fallback{display:none;max-width:760px;margin:0 auto;padding:40px 24px;font-size:17px;line-height:1.5;color:var(--paper);height:100%;box-sizing:border-box;overflow:auto}
  #fallback h1{font-family:var(--hf);font-weight:500;font-size:34px;margin:0 0 8px}
  #fallback ol{padding-left:0;list-style:none}#fallback li{margin:10px 0}#fallback b{display:block;font-weight:600}
  @media (max-width:1100px){
    /* the paused pill moves under the setting label, so a long setting never runs into it */
    #paused{top:calc(max(18px,2.6vh) + 44px);left:max(24px,4vw);transform:none}
  }
  @media (max-width:900px){
    #nav{width:min(230px,calc(100vw - 90px))}
    #hint{display:none}
    #panel{box-sizing:border-box;max-width:calc(100vw - max(24px,4vw) - 72px)}
  }
  @media (max-width:640px){
    /* phone: the corner labels stack; the rail is a row under them; the scrubber takes its own row; the indicator shows the current beat in words */
    #top{flex-direction:column;align-items:flex-start;gap:6px;font-size:12px}
    #top #sidx{text-align:left}
    #panel{width:auto;bottom:calc(max(12px,1.6vh) + 88px + 12px)}
    #steps{white-space:normal;gap:.45em}
    #steps span{font-size:0;width:7px;height:7px;border-radius:50%;background:rgba(243,239,230,.45)}
    #steps span+span:before{display:none}
    #steps span.on{font-size:12.5px;width:auto;height:auto;border-radius:0;background:none}
    /* phone: chips may wrap, so they sit in a plain row with a gap and no connector lines */
    #strip{gap:6px}#strip button{padding:.35em .7em}#strip button+button{margin-left:0}#strip button+button:before{display:none}
    #bar{left:10px;right:10px;height:88px;flex-wrap:wrap;align-content:center;padding:0 6px}
    #prog{order:-1;flex:1 0 100%;margin:0;height:40px;box-sizing:border-box}
    #tm{padding:0 6px;font-size:12px;margin-right:auto}
    #head{font-size:23px;line-height:1.14}#head.long{font-size:20px}
    #sup{font-size:15px;line-height:1.32}
    #panel.info #head{font-size:22px}
    #info{margin-top:10px}
    #cards{grid-template-columns:1fr;gap:7px}
    .card{padding:9px 11px;border-radius:12px;border-top-width:1px;border-left:3px solid rgba(243,239,230,.35)}
    .card.now{border-left-color:var(--paper)}
    .card .ct{margin-bottom:4px;gap:.55em}.card .ic{width:30px;height:30px;border-radius:8px}
    #info h3{font-size:17px}#info p{font-size:14px;line-height:1.3}
    #foot{font-size:12.5px!important;line-height:1.3!important;margin-top:8px!important}
    #road{grid-template-columns:1fr;padding:11px 12px 4px}
    .stage{display:grid;grid-template-columns:34px minmax(0,1fr);column-gap:11px;padding:0 0 9px}
    .stage .trk{grid-column:1;grid-row:1 / span 2;flex-direction:column;margin:0 0 -9px}
    .stage:last-child .trk{margin:0}
    .stage .node{width:34px;height:34px}
    .stage .ln{flex:1 1 auto;width:0;min-height:6px;border-top:0;border-left:3px solid var(--paper);transform:scaleY(var(--r,0));transform-origin:center top}
    .stage .ln.dash{border-left-style:dashed}
    .stage h3{grid-column:2;align-self:end;padding-top:5px}.stage p{grid-column:2;margin-top:1px!important}
    #bnum{font-size:38px}#blab{font-size:13px}
    #strip{margin-top:8px}
    #rail{top:calc(max(18px,2.6vh) + 66px);right:10px;transform:none;flex-direction:row}
    #rail [data-tip]:after{display:none}
    #nav{top:calc(max(18px,2.6vh) + 114px);right:10px;transform:none;max-height:calc(100vh - max(18px,2.6vh) - 126px);z-index:2}
    #nav.open~#navback,#navback.on{display:block;position:absolute;inset:0;background:rgba(15,22,20,.7);pointer-events:auto;z-index:1}
    #rail{z-index:2}
    #paused{top:calc(max(18px,2.6vh) + 72px);left:max(24px,4vw);transform:none}
  }
  @media (prefers-reduced-motion:reduce){#panel,#strip button,#steps span,#bar,#nav,#rail,[data-tip]:after{transition:none}}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="ui">
  <div id="scrim"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" integrity="sha384-CI3ELBVUz9XQO+97x6nwMDPosPR5XvsxW2ua7N1Xeygeh1IxtgqtCkGfQY9WWdHu" crossorigin="anonymous"></script>
<script>
(function(){
'use strict';

/* ==================================================================================================================
   CONFIG - THE ONLY BLOCK A NEW FILM EDITS
   ------------------------------------------------------------------------------------------------------------------
   beats[]   one entry per scene on the timeline, in order, contiguous (start of each = start + dur of the one before).
             beat: 0 = an open or close card, 1-4 = The situation / The AI at work / What can go wrong / How it is kept safe.
             A beat may span several consecutive entries (e.g. two seeded faults in beat 3); they share the numeral.
             Fields: name (scene name: navigation, FILM.scenes, fallback), start, dur (seconds), setting (top-left label:
             the place and moment), source (small line beside the numeral: where the beat comes from, e.g. "AI Canvas:
             Business Problem"), head (headline), sup (support line, optional), note (small line, optional, e.g. to mark a
             staged fault), chips (optional step buttons [{label, at}] at local times), cards / stages (optional
             infographic [{ic, at, title, text, cond}], with foot and footAt), nav (optional shorter navigation label),
             cam (camera keys in LOCAL time: [lt, px,py,pz, lx,ly,lz] look-at, or [lt, px,py,pz, sx,sy,sz, nx,ny] aimed
             so the subject (sx,sy,sz) lands at screen offset (nx,ny) in half-frames, +x right, +y up; a 10th element
             (any value) keeps the horizon level).
   build(THREE, scene, kit) -> objects   builds the whole 3D world ONCE, using the props kit. Never add objects later.
   update(t, objects, ctx)               stages the world at film time t. Must be a pure function of t: the kit
             restores every object, material, light and screen to its build-time state before each call, so update
             only sets what differs from that state at time t. ctx = { i, entry, beat, lt (local time), u (0..1 in the
             entry), kit, camKeys(keys, lt) }. Readable words never go in the 3D world: screens show glyphs, bars, colours.
   ================================================================================================================== */
/* ---- film-local glyph painters (canvas only; glyphs, bars, lines and colours, never words). Colours follow the script:
   blue = demand and data; green = a person's approval; amber = open, or held for a person; red = a possible harm the screen must
   test, drawn dashed only and never pulsing; grey = idle or empty; dashed white = planned, not built. */
var DP = { blue:'#4a86d8', ok:'#3fa34d', amber:'#e9a23b', red:'#d84a3a', grey:'#8a8f98', dark:'#16222c', paper:'#f3f1ec', slate:'#4f5b66' };
// the seven AI Canvas panels on the meeting-room wall: [x, y, w, h] as fractions (top row four, bottom row three)
// 0 Business Problem, 1 Business Value, 2 Objective Function, 3 Modeling Approach, 4 Model Training, 5 Customer Value, 6 Data Strategy
var DP_CELLS = [[0.03,0.05,0.22,0.43],[0.27,0.05,0.22,0.43],[0.51,0.05,0.22,0.43],[0.75,0.05,0.22,0.43],[0.03,0.52,0.30,0.43],[0.35,0.52,0.30,0.43],[0.67,0.52,0.30,0.43]];
function dpRR(c, x, y, w, h, r){ r = Math.max(0, Math.min(r, w/2, h/2)); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
// a line, dashed or solid, with an optional arrowhead at its end
function dpA(c, x0, y0, x1, y1, lw, col, dash, head){
  c.save(); c.strokeStyle = col; c.fillStyle = col; c.lineWidth = lw; c.lineCap = 'round'; c.setLineDash(dash || []); c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke(); c.setLineDash([]);
  if (head) { var a = Math.atan2(y1 - y0, x1 - x0); c.beginPath(); c.moveTo(x1, y1); c.lineTo(x1 - head*Math.cos(a - 0.45), y1 - head*Math.sin(a - 0.45)); c.lineTo(x1 - head*Math.cos(a + 0.45), y1 - head*Math.sin(a + 0.45)); c.closePath(); c.fill(); }
  c.restore(); }
// one glyph centred at (x, y) with radius r; o.fill fills a tag, o.hole is the colour of its punched hole, o.dash draws it dashed
function dpG(c, n, x, y, r, col, o){
  o = o || {}; var PI = Math.PI;
  c.save(); c.translate(x, y); c.lineCap = 'round'; c.lineJoin = 'round'; c.setLineDash(o.dash ? [r*0.22, r*0.16] : []);
  c.strokeStyle = col; c.fillStyle = col; c.lineWidth = Math.max(1.5, r*(o.lw || 0.14));
  function P(pts, close, fill){ c.beginPath(); c.moveTo(pts[0]*r, pts[1]*r); for (var k=2;k<pts.length;k+=2) c.lineTo(pts[k]*r, pts[k+1]*r); if (close) c.closePath(); if (fill) c.fill(); else c.stroke(); }
  function C(cx, cy, rad, fill){ c.beginPath(); c.arc(cx*r, cy*r, rad*r, 0, 2*PI); if (fill) c.fill(); else c.stroke(); }
  switch (n) {
    case 'tag': P([-0.95,0, -0.5,-0.5, 0.85,-0.5, 0.85,0.5, -0.5,0.5], true, o.fill); if (o.fill) { c.fillStyle = o.hole || DP.dark; C(-0.45,0,0.13,true); } else C(-0.45,0,0.13); break;
    case 'box': P([-0.6,-0.2, 0.2,-0.2, 0.2,0.7, -0.6,0.7], true); P([-0.6,-0.2, -0.25,-0.6, 0.55,-0.6, 0.2,-0.2]); P([0.55,-0.6, 0.55,0.3, 0.2,0.7]); break;
    case 'coin': C(0,0,0.72); C(0,0,0.42); break;
    case 'target': C(0,0,0.75); C(0,0,0.45); C(0,0,0.14,true); break;
    case 'loop': c.beginPath(); c.arc(0, 0, 0.6*r, -PI*0.3, PI*1.3); c.stroke(); P([0.12,-0.82, 0.48,-0.5, 0.08,-0.28]); break;
    case 'person': C(0,-0.38,0.3,true); c.beginPath(); c.arc(0, 0.75*r, 0.62*r, PI, 2*PI); c.fill(); break;
    case 'socket': dpRR(c, -0.62*r, -0.5*r, 1.24*r, 1.0*r, 0.2*r); c.stroke(); P([-0.25,-0.18, -0.25,0.12]); P([0.25,-0.18, 0.25,0.12]); break;
    case 'clock': C(0,0,0.7); P([0,-0.42, 0,0, 0.3,0.2]); break;
    case 'fork': P([-0.8,0, -0.1,0]); P([-0.1,0, 0.7,-0.55]); P([-0.1,0, 0.7,0.55]); C(-0.1,0,0.12,true); break;
    case 'check': P([-0.55,0.02, -0.15,0.4, 0.6,-0.42]); break;
    case 'up': P([0,0.75, 0,-0.7]); P([-0.42,-0.28, 0,-0.72, 0.42,-0.28]); break;
    case 'cal': dpRR(c, -0.7*r, -0.55*r, 1.4*r, 1.25*r, 0.12*r); c.stroke(); P([-0.7,-0.15, 0.7,-0.15]); P([-0.35,-0.8, -0.35,-0.4]); P([0.35,-0.8, 0.35,-0.4]); break;
    case 'slot': c.setLineDash([r*0.2, r*0.14]); dpRR(c, -0.9*r, -0.5*r, 1.8*r, 1.0*r, 0.12*r); c.stroke(); break;
    case 'lines': P([-0.8,0.45, -0.3,0.05, 0.1,0.15, 0.8,-0.5]); P([-0.8,0.75, -0.3,0.35, 0.1,0.45, 0.8,-0.2]); P([-0.3,0.05, -0.3,0.35]); P([0.45,-0.18, 0.45,0.12]); break;
    default: C(0,0,0.3,true);
  }
  c.restore(); }
var DPP = {
  // P1 wall screen: demand (blue) moves all the time; the price (white) is flat, steps once at the review marker, then is flat again.
  // On the close: the closed gate with its amber lamp and two empty grey check rings (intake; first risk screen) in front of it.
  office: function(c, W, H, p){
    c.fillStyle = DP.dark; c.fillRect(0, 0, W, H);
    var x0 = W*0.05, x1 = W*0.95, y0 = H*0.1, y1 = H*0.74, i, ms = 0.56;
    c.globalAlpha = p.close ? 0.4 : 1;
    c.fillStyle = 'rgba(235,240,245,.07)'; for (i=0;i<=6;i++) c.fillRect(x0, y0 + (y1 - y0)*i/6, x1 - x0, 1.5);
    c.strokeStyle = DP.blue; c.lineWidth = H*0.022; c.lineJoin = 'round'; c.beginPath();
    for (i=0;i<=48;i++){ var u = i/48, v = 0.5 + 0.26*Math.sin(u*9.5 + p.ph) + 0.08*Math.sin(u*23 + p.ph*1.7), xx = x0 + (x1 - x0)*u, yy = y1 - (y1 - y0)*v; if (i) c.lineTo(xx, yy); else c.moveTo(xx, yy); }
    c.stroke();
    var xs = x0 + (x1 - x0)*ms, ya = y1 - (y1 - y0)*0.38, yb = y1 - (y1 - y0)*0.58;
    c.strokeStyle = '#ffffff'; c.lineWidth = H*0.018; c.beginPath(); c.moveTo(x0, ya); c.lineTo(xs, ya); c.lineTo(xs, yb); c.lineTo(x1, yb); c.stroke();
    dpA(c, xs, y1 + H*0.02, xs, y0, 2, 'rgba(235,240,245,.35)', [5, 5]);
    dpG(c, 'cal', xs, H*0.86, H*0.065, 'rgba(235,240,245,.85)');
    c.globalAlpha = 1;
    if (p.close) {
      c.fillStyle = 'rgba(22,34,44,.88)'; dpRR(c, W*0.2, H*0.18, W*0.6, H*0.64, H*0.05); c.fill();
      var gx = W*0.3, gy = H*0.7;
      c.fillStyle = '#c9d2d9'; c.fillRect(gx - H*0.02, H*0.33, H*0.04, gy - H*0.33);
      c.fillRect(gx - H*0.06, gy - H*0.01, H*0.12, H*0.03);
      for (i=0;i<6;i++){ c.fillStyle = i % 2 ? '#7d8790' : '#f2f0ea'; c.fillRect(gx + H*0.02 + i*W*0.04, H*0.46, W*0.04, H*0.055); }
      c.fillStyle = DP.amber; c.beginPath(); c.arc(gx, H*0.29, H*0.05, 0, 2*Math.PI); c.fill();
      c.strokeStyle = DP.grey; c.lineWidth = H*0.018; for (i=0;i<2;i++){ c.beginPath(); c.arc(W*(0.62 + i*0.1), H*0.49, H*0.07, 0, 2*Math.PI); c.stroke(); }
    }
  },
  // P1 analyst's monitor: the price list as tag rows, checked one by one (grey to white)
  list: function(c, W, H, p){
    c.fillStyle = DP.dark; c.fillRect(0, 0, W, H); c.fillStyle = '#2c3a46'; c.fillRect(0, 0, W, H*0.13);
    var n = 7, rh = H*0.8/n, i;
    for (i=0;i<n;i++){ var y = H*0.17 + i*rh, on = i < p.lit, col = on ? 'rgba(235,240,245,.9)' : 'rgba(235,240,245,.25)';
      if (i === p.lit) { c.fillStyle = 'rgba(235,240,245,.08)'; c.fillRect(W*0.03, y, W*0.94, rh*0.86); }
      dpG(c, 'tag', W*0.1, y + rh*0.43, rh*0.3, col, { fill:true, hole:DP.dark });
      c.fillStyle = col; dpRR(c, W*0.2, y + rh*0.3, W*(0.35 + 0.25*((i*37 + 11) % 13)/13), rh*0.26, rh*0.13); c.fill();
      dpRR(c, W*0.8, y + rh*0.3, W*0.12, rh*0.26, rh*0.13); c.fill(); }
  },
  // P2 wall canvas: the seven blocks as dashed panels with a glyph each; on = how many have lit up; hi = the panel pointed at.
  // The value panel's bar is an empty dashed outline: it never fills.
  canvas: function(c, W, H, p){
    c.fillStyle = '#1b2530'; c.fillRect(0, 0, W, H);
    for (var i=0;i<7;i++){ var q = DP_CELLS[i], x = q[0]*W, y = q[1]*H, w = q[2]*W, h = q[3]*H, g = Math.max(0, Math.min(1, p.on - i)), hi = p.hi === i;
      c.fillStyle = 'rgba(235,240,245,' + (0.03 + 0.07*g + (hi ? 0.07 : 0)).toFixed(3) + ')'; dpRR(c, x, y, w, h, H*0.025); c.fill();
      c.save(); c.strokeStyle = 'rgba(235,240,245,' + (0.25 + 0.6*g).toFixed(3) + ')'; c.lineWidth = hi ? H*0.012 : H*0.007; c.setLineDash([H*0.03, H*0.02]); dpRR(c, x, y, w, h, H*0.025); c.stroke(); c.restore();
      var col = 'rgba(235,240,245,' + (0.2 + 0.75*g).toFixed(3) + ')', cx = x + w*0.5, cy = y + h*0.45, r = h*0.24;
      if (i === 0) { dpG(c, 'clock', cx, cy - r*0.62, r*0.5, col); dpG(c, 'tag', cx, cy + r*0.55, r*0.6, col); }
      else if (i === 1) { dpG(c, 'coin', cx - r*0.6, cy, r*0.8, col); dpG(c, 'up', cx + r*0.85, cy, r*0.7, col);
        c.save(); c.strokeStyle = col; c.lineWidth = H*0.008; c.setLineDash([H*0.02, H*0.015]); dpRR(c, x + w*0.15, y + h*0.8, w*0.7, h*0.1, h*0.04); c.stroke(); c.restore(); }
      else if (i === 2) dpG(c, 'target', cx, cy, r, col);
      else if (i === 3) dpG(c, 'box', cx, cy, r, col, { dash:true });
      else if (i === 4) dpG(c, 'loop', cx, cy, r, col);
      else if (i === 5) dpG(c, 'person', cx, cy, r, col);
      else dpG(c, 'socket', cx, cy, r, col); }
  },
  // P2 glass board, the plan drawn dashed: three empty sockets -> an empty model box -> a price tag; over the tag the margin curve with a
  // dial that sweeps along it and back without stopping (no price is picked); in 2.2 the set-or-suggest fork. Neither path lights.
  board: function(c, W, H, p){
    c.fillStyle = '#25313b'; c.fillRect(0, 0, W, H);
    var a = function(t0){ return Math.max(0, Math.min(1, (p.d - t0)/0.12)); }, wc = function(al){ return 'rgba(235,240,245,' + (0.9*al).toFixed(3) + ')'; }, lw = H*0.012, dash = [H*0.03, H*0.022], i;
    if (a(0) > 0) { c.save(); c.globalAlpha = a(0); for (i=0;i<3;i++) dpG(c, 'socket', W*0.08, H*(0.38 + i*0.17), H*0.055, DP.grey); c.restore(); }
    if (a(0.2) > 0) dpA(c, W*0.125, H*0.55, W*0.215, H*0.55, lw, wc(a(0.2)), dash, H*0.03);
    if (a(0.4) > 0) { c.save(); c.strokeStyle = wc(a(0.4)); c.lineWidth = lw; c.setLineDash(dash); dpRR(c, W*0.23, H*0.42, W*0.12, H*0.26, H*0.02); c.stroke(); c.restore(); }
    if (a(0.6) > 0) dpA(c, W*0.36, H*0.55, W*0.72, H*0.55, lw, wc(a(0.6)), dash, H*0.03);
    if (a(0.8) > 0) dpG(c, 'tag', W*0.8, H*0.55, H*0.075, wc(a(0.8)), { dash:true, lw:0.16 });
    if (p.cv > 0) { c.save(); c.globalAlpha = p.cv; var cx0 = W*0.6, cx1 = W*0.97, cb = H*0.36, ct = H*0.08;
      c.strokeStyle = 'rgba(235,240,245,.3)'; c.lineWidth = 2; c.beginPath(); c.moveTo(cx0, cb); c.lineTo(cx1, cb); c.stroke();
      c.strokeStyle = DP.blue; c.lineWidth = lw; c.setLineDash(dash); c.beginPath();
      for (i=0;i<=30;i++){ var u = i/30, xx = cx0 + (cx1 - cx0)*u, yy = cb - (cb - ct)*(1 - Math.pow(2*u - 1, 2)); if (i) c.lineTo(xx, yy); else c.moveTo(xx, yy); }
      c.stroke(); c.setLineDash([]);
      if (p.nd >= 0) { var un = 0.08 + 0.84*p.nd, nx = cx0 + (cx1 - cx0)*un, ny = cb - (cb - ct)*(1 - Math.pow(2*un - 1, 2));
        c.strokeStyle = DP.blue; c.lineWidth = H*0.008; c.beginPath(); c.moveTo(nx, cb); c.lineTo(nx, ny); c.stroke(); c.fillStyle = DP.blue; c.beginPath(); c.arc(nx, ny, H*0.02, 0, 2*Math.PI); c.fill(); }
      c.restore(); }
    if (p.fk > 0) { c.save(); c.globalAlpha = p.fk;
      dpA(c, W*0.45, H*0.55, W*0.53, H*0.8, lw, wc(1), dash);
      dpG(c, 'person', W*0.585, H*0.755, H*0.05, wc(1)); c.strokeStyle = wc(1); c.lineWidth = lw; c.beginPath(); c.moveTo(W*0.54, H*0.84); c.lineTo(W*0.63, H*0.84); c.stroke();

      dpA(c, W*0.74, H*0.8, W*0.785, H*0.63, lw, wc(1), dash, H*0.03);

  },
  // a what-if customer's phone (desaturated): the same generic product glyph on both
  mphone: function(c, W, H){ c.fillStyle = '#e4e2dd'; c.fillRect(0, 0, W, H); c.fillStyle = '#9aa1a8'; c.fillRect(0, 0, W, H*0.1); dpG(c, 'box', W*0.5, H*0.5, W*0.3, '#5d6a75'); },
  // the what-if agent's screen: the product tag, an upward arrow, an empty grey reason slot; a dashed red outline forms around the slot
  agent: function(c, W, H, p){

    if (p.red > 0) { c.save(); c.globalAlpha = p.red; c.strokeStyle = DP.red; c.lineWidth = H*0.035; c.setLineDash([H*0.07, H*0.05]); dpRR(c, W*0.47, H*0.27, W*0.5, H*0.58, H*0.08); c.stroke(); c.restore(); }
  },
  // the shared-tool what-if backboard: our price line (left) and the rival's (right) rise together, step for step; the blue demand
  // line along the bottom dips; a dashed red outline wraps both price lines
  market: function(c, W, H, p){
    c.fillStyle = '#d5d8db'; c.fillRect(0, 0, W, H);

FILM.seek = function(t){ t = norm(+t || 0); state.playing = false; state.t = t; state.base = t; render(t); syncPlay(); };
FILM.play = function(){ if (state.playing) return; state.base = state.t; state.p0 = now(); state.playing = true; syncPlay(); wake(); };
FILM.pause = function(){ if (!state.playing) return; state.t = currentTime(); state.playing = false; render(state.t); syncPlay(); wake(); };
// scene stepping: next() goes to the next scene start (the first after the last), prev() to the current scene start when more than
// 1.5 s into it, else to the previous scene start; both keep the current play state. restart() goes to 0 and plays.
FILM.next = function(){ var i = sceneAt(currentTime()); jump(i >= NB - 1 ? 0 : B[i+1].start); };
FILM.prev = function(){ var t = currentTime(), i = sceneAt(t); jump(t - B[i].start > 1.5 || i === 0 ? B[i].start : B[i-1].start); };
FILM.restart = function(){ FILM.seek(0); FILM.play(); };
Object.defineProperty(FILM, 'playing', { get:function(){ return state.playing; }, enumerable:true });
var drag = null;
function syncPlay(){ el.bar.classList.toggle('playing', state.playing); el.bplay.setAttribute('aria-label', state.playing ? 'Pause' : 'Play');
  el.hintpp.textContent = state.playing ? 'pause' : 'play'; el.ui.classList.toggle('paused', !state.playing && FILM.ready && !drag); }
// idle fade: the bar and rail drop to low opacity 2.5 s after the last input while playing; never while paused
var idleTimer = null;
function wake(){ el.ui.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(function(){ if (state.playing) { el.ui.classList.add('idle'); closeNav(); el.ui.classList.remove('navshow'); } }, 2500); }
['mousemove','pointerdown','touchstart','keydown'].forEach(function(ev){ window.addEventListener(ev, wake, { passive:true }); });
function loop(){ requestAnimationFrame(loop); if (!state.playing) return; state.t = currentTime(); render(state.t); }
window.addEventListener('resize', function(){ if (!renderer) return; resize(); if (!state.playing) render(state.t); });
el.bplay.addEventListener('click', function(){ state.playing ? FILM.pause() : FILM.play(); });
el.brestart.addEventListener('click', function(){ FILM.restart(); });
el.bprev.addEventListener('click', function(){ FILM.prev(); });
el.bnext.addEventListener('click', function(){ FILM.next(); });
// scrubber: click seeks; press-and-drag scrubs; play resumes on release if it was playing; arrow keys on the focused slider step 5 s
function progT(e){ var r = el.prog.getBoundingClientRect(); return Math.min(clamp((e.clientX - r.left)/r.width, 0, 1)*DUR, DUR - 0.05); }
el.prog.addEventListener('pointerdown', function(e){ e.preventDefault(); drag = { was:state.playing }; try { el.prog.setPointerCapture(e.pointerId); } catch (x) {} FILM.seek(progT(e)); });
el.prog.addEventListener('pointermove', function(e){ if (drag) FILM.seek(progT(e)); });
function endDrag(e){ if (!drag) return; if (e && e.type === 'pointerup') FILM.seek(progT(e)); var was = drag.was; drag = null; if (was) FILM.play(); else syncPlay(); }
el.prog.addEventListener('pointerup', endDrag); el.prog.addEventListener('pointercancel', endDrag); el.prog.addEventListener('lostpointercapture', endDrag);
var navHide = null;
function navShow(on){ clearTimeout(navHide); if (on) el.ui.classList.add('navshow'); else navHide = setTimeout(function(){ el.ui.classList.remove('navshow'); }, 350); }
[el.rail, el.nav].forEach(function(n){ n.addEventListener('mouseenter', function(){ navShow(true); }); n.addEventListener('mouseleave', function(){ navShow(false); }); });
railDots.forEach(function(d){ d.addEventListener('click', function(){ jump(+d.getAttribute('data-t')); closeNav(); }); });
el.navback.addEventListener('click', closeNav);
el.navtog.addEventListener('click', function(){ var open = !el.nav.classList.contains('open'); el.nav.classList.toggle('open', open); el.navtog.setAttribute('aria-expanded', open ? 'true' : 'false'); });
// keyboard: Space play/pause, Left/Right previous/next scene, Home restart, Escape closes the scene list. Space on a focused button is left to the button.
window.addEventListener('keydown', function(e){
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  var k = e.key, onBtn = e.target && e.target.tagName === 'BUTTON';
  if (k === ' ' || k === 'Spacebar') { if (onBtn) return; e.preventDefault(); state.playing ? FILM.pause() : FILM.play(); }
  else if (k === 'ArrowRight') { e.preventDefault(); FILM.next(); }
  else if (k === 'ArrowLeft') { e.preventDefault(); FILM.prev(); }
  else if (k === 'Home') { e.preventDefault(); FILM.restart(); }
  else if (k === 'Escape') closeNav();
});
function start(){
  try { renderer = createRenderer(); } catch (e) { showFallback(); return; }
  resize();
  FILM.mode = present.mode;
  if (present.mode === '2d') { present.onFirst = function(){ FILM.ready = true; syncPlay(); FILM.play(); }; FILM.seek(0); }
  else { FILM.seek(0); FILM.ready = true; FILM.play(); }
  loop();
}
// The title card shows at once; the GL context is created once the fonts are in and the page has been up for about 2.4 s.
updateHUD(0);
var started = false, fontsIn = false;
function go(){ if (started || !fontsIn) return; var wait = Math.max(0, 2400 - performance.now()); started = true; setTimeout(start, wait); }
function fontsReady(){ fontsIn = true; go(); }
if (document.fonts && document.fonts.ready) { document.fonts.ready.then(fontsReady, fontsReady); setTimeout(fontsReady, 2500); } else { fontsReady(); }
})();
</script>
</body>
</html>
